// ---------- Indeling tab ----------
function IndelingTab({state, addIndeling, removeIndeling, positieById, werknemerById, checkBeveiligingspasWaarschuwing}){
  const [sortBy, setSortBy] = useState('sectie'); // 'sectie' | 'naam' | 'bezetting'
  const [query, setQuery] = useState('');
  const [foutmelding, setFoutmelding] = useState(null);
  const [verbergIngevuld, setVerbergIngevuld] = useState(false);
  // key = sectie, of "sectie||ingang" voor een ingang-subgroep — true = ingeklapt.
  const [ingeklapt, setIngeklapt] = useState({});
  const toggleIngeklapt = (key) => setIngeklapt(prev => ({...prev, [key]: !prev[key]}));

  // Indelingen per positie groeperen
  const indelingenPerPositie = useMemo(() => {
    const m = {};
    state.indelingen.forEach(ind => {
      if(!m[ind.positieId]) m[ind.positieId] = [];
      m[ind.positieId].push(ind);
    });
    return m;
  }, [state.indelingen]);

  // Een positie is altijd vol bij 1 indeling — ook een plakdienst/dubbele dienst krijgt maar
  // één persoon gekoppeld (die persoon draait dan zelf een dubbele dienst; het is geen slot
  // voor twee verschillende mensen). Losstaand dubbel-ingepland-zijn van één persoon over
  // meerdere posities blijft gedekt door de 'Dubbel gepland'-controle hieronder.
  const isVol = (inds) => inds.length >= 1;

  // Bezettingsgraad per sectie: hoeveel van de posities in die sectie minstens één indeling
  // hebben, tegenover het totaal aantal posities in die sectie. Geeft in één oogopslag inzicht
  // in waar nog gaten zitten, zonder door de hele lijst te hoeven scrollen.
  const bezettingPerSectie = useMemo(() => {
    const m = {};
    state.posities.forEach(p => {
      const key = p.sectie || '(geen sectie)';
      if(!m[key]) m[key] = {bezet: 0, totaal: 0};
      m[key].totaal += 1;
      if((indelingenPerPositie[p.id] || []).length > 0) m[key].bezet += 1;
    });
    return Object.entries(m).sort((a,b) => a[0].localeCompare(b[0]));
  }, [state.posities, indelingenPerPositie]);

  const gesorteerdePosities = useMemo(() => {
    let list = [...state.posities];
    if(query){
      const q = query.toLowerCase();
      list = list.filter(p => {
        if(p.naam.toLowerCase().includes(q) || (p.sectie||'').toLowerCase().includes(q) || (p.ingang||'').toLowerCase().includes(q)) return true;
        const inds = indelingenPerPositie[p.id] || [];
        return inds.some(ind => {
          const w = werknemerById[ind.werknemerId];
          return (w?.naam||'').toLowerCase().includes(q) || (w?.organisatie||'').toLowerCase().includes(q);
        });
      });
    }
    if(verbergIngevuld) list = list.filter(p => !isVol(indelingenPerPositie[p.id] || []));
    if(sortBy==='sectie') list.sort((a,b) => (a.sectie||'').localeCompare(b.sectie||'') || (a.ingang||'').localeCompare(b.ingang||'') || a.naam.localeCompare(b.naam));
    if(sortBy==='naam') list.sort((a,b) => a.naam.localeCompare(b.naam));
    if(sortBy==='bezetting') list.sort((a,b) => (indelingenPerPositie[a.id]?.length||0) - (indelingenPerPositie[b.id]?.length||0));
    return list;
  }, [state.posities, sortBy, query, verbergIngevuld, indelingenPerPositie, werknemerById]);

  // Groepeert de (al gesorteerde) posities als Sectie > Ingang > posities, zodat direct te zien
  // is welke positie bij welke ingang/sectie hoort. Alleen zinvol bij sorteren op sectie — bij
  // sorteren op naam/bezetting blijft het een platte lijst.
  const gegroepeerdVoorWeergave = useMemo(() => {
    if(sortBy !== 'sectie') return null;
    const bezet = (posities) => posities.filter(p => (indelingenPerPositie[p.id]||[]).length > 0).length;
    const groepen = [];
    const sectieIndex = {};
    gesorteerdePosities.forEach(p => {
      const sectieKey = p.sectie || '(geen sectie)';
      let groep = sectieIndex[sectieKey];
      if(!groep){ groep = {sectie: sectieKey, directPos: [], ingangenMap: {}, ingangenOrder: []}; sectieIndex[sectieKey] = groep; groepen.push(groep); }
      if(p.ingang){
        if(!groep.ingangenMap[p.ingang]){ groep.ingangenMap[p.ingang] = []; groep.ingangenOrder.push(p.ingang); }
        groep.ingangenMap[p.ingang].push(p);
      } else {
        groep.directPos.push(p);
      }
    });
    groepen.forEach(groep => {
      const alle = [...groep.directPos, ...groep.ingangenOrder.flatMap(i => groep.ingangenMap[i])];
      groep.totaal = alle.length;
      groep.bezet = bezet(alle);
      groep.ingangenBezetting = {};
      groep.ingangenOrder.forEach(i => {
        groep.ingangenBezetting[i] = {totaal: groep.ingangenMap[i].length, bezet: bezet(groep.ingangenMap[i])};
      });
    });
    return groepen;
  }, [gesorteerdePosities, sortBy, indelingenPerPositie]);

  // Werknemers die dubbel gepland staan: twee keer op reguliere diensten, of twee keer op plakdiensten.
  // Een combinatie van 1 reguliere + 1 plakdienst is toegestaan en wordt niet gemeld.
  const dubbelGepland = useMemo(() => {
    const perWerknemer = {};
    state.indelingen.forEach(ind => {
      if(!perWerknemer[ind.werknemerId]) perWerknemer[ind.werknemerId] = [];
      perWerknemer[ind.werknemerId].push(ind);
    });
    const result = [];
    Object.entries(perWerknemer).forEach(([wid, inds]) => {
      const werknemer = werknemerById[wid];
      if(!werknemer) return;
      const regulier = inds.filter(ind => !positieById[ind.positieId]?.plakdienst);
      const plak = inds.filter(ind => positieById[ind.positieId]?.plakdienst);
      const problemen = [];
      if(regulier.length > 1) problemen.push(...regulier);
      if(plak.length > 1) problemen.push(...plak);
      if(problemen.length > 0) result.push({werknemer, indelingen: problemen});
    });
    return result;
  }, [state.indelingen, werknemerById, positieById]);

  // Alle werknemers die nog nergens aan gekoppeld zijn, voor het overzicht rechts.
  const nietIngedeeldeWerknemers = useMemo(() => {
    const gekoppeldeIds = new Set(state.indelingen.map(ind => ind.werknemerId));
    return state.werknemers.filter(w => !gekoppeldeIds.has(w.id)).sort((a,b)=>a.naam.localeCompare(b.naam));
  }, [state.werknemers, state.indelingen]);

  const werknemerNamen = useMemo(() => state.werknemers.map(w => w.naam), [state.werknemers]);

  const [pendingTekst, setPendingTekst] = useState({}); // positieId -> getypte naam
  const [pasWaarschuwing, setPasWaarschuwing] = useState(null); // {positieId, werknemer, tekst}

  // Bord-weergave: tik-gebaseerd alternatief voor het tekstveld, ook bruikbaar op tablet/touch
  // (native HTML5 drag-and-drop werkt onbetrouwbaar op touch-schermen, tikken werkt overal).
  // Op desktop kan daarnaast ook gesleept worden — sneller met een muis dan twee keer klikken.
  const [weergave, setWeergave] = useState('lijst'); // 'lijst' | 'bord'
  const [geselecteerdeWerknemerId, setGeselecteerdeWerknemerId] = useState(null);
  const [dragOverPositieId, setDragOverPositieId] = useState(null);

  const koppelViaBord = (positieId, werknemerId) => {
    const positie = positieById[positieId];
    const werknemer = werknemerById[werknemerId];
    const waarschuwing = checkBeveiligingspasWaarschuwing(positie, werknemer);
    if(waarschuwing){ setPasWaarschuwing({positieId, werknemer, tekst: waarschuwing}); return; }
    const error = addIndeling(positieId, werknemerId);
    if(error){ setFoutmelding(error); return; }
    setGeselecteerdeWerknemerId(null);
  };

  const werknemerSlepenStart = (e, werknemerId) => {
    e.dataTransfer.setData('text/plain', werknemerId);
    e.dataTransfer.effectAllowed = 'move';
  };
  const positieDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
  const positieDrop = (e, positieId, vol) => {
    e.preventDefault();
    setDragOverPositieId(null);
    if(vol) return;
    const werknemerId = e.dataTransfer.getData('text/plain');
    if(werknemerId) koppelViaBord(positieId, werknemerId);
  };

  // Probeert te koppelen op basis van de getypte tekst voor één positie.
  // toonFout: of een foutmelding getoond moet worden als de tekst geen geldige werknemer is
  // (true bij Enter/blur — de gebruiker is klaar met typen; false bij stille pogingen).
  // tekstOverride: gebruikt bij het direct kiezen van een naam uit de suggesties, omdat
  // pendingTekst dan nog niet is bijgewerkt op het moment van aanroepen (state-update is async).
  const probeerKoppelen = (positieId, toonFout, negeerPasWaarschuwing, tekstOverride) => {
    const tekst = (tekstOverride !== undefined ? tekstOverride : (pendingTekst[positieId] || '')).trim();
    if(!tekst) return;
    const werknemer = state.werknemers.find(w => naamGelijk(w.naam, tekst));
    if(!werknemer){
      if(toonFout) setFoutmelding(`Geen werknemer gevonden met de naam "${tekst}". Voeg deze eerst toe bij Werknemers, of kies uit de suggesties tijdens het typen.`);
      return;
    }
    const positie = positieById[positieId];
    if(!negeerPasWaarschuwing){
      const waarschuwing = checkBeveiligingspasWaarschuwing(positie, werknemer);
      if(waarschuwing){ setPasWaarschuwing({positieId, werknemer, tekst: waarschuwing}); return; }
    }
    const error = addIndeling(positieId, werknemer.id);
    if(error){ if(toonFout) setFoutmelding(error); return; }
    setPendingTekst(prev => ({...prev, [positieId]: ''}));
    setPasWaarschuwing(null);
  };

  const handleKoppelTekst = (positieId, negeerPasWaarschuwing) => probeerKoppelen(positieId, true, negeerPasWaarschuwing);

  // Bevestigt een pas-waarschuwing voor zowel het tekstveld als het bord: pasWaarschuwing
  // bevat altijd al het opgeloste werknemer-object, dus dit hoeft niet opnieuw op getypte
  // tekst te zoeken (die is er bij het bord ook helemaal niet).
  const bevestigPasWaarschuwing = () => {
    if(!pasWaarschuwing) return;
    const error = addIndeling(pasWaarschuwing.positieId, pasWaarschuwing.werknemer.id);
    if(error){ setFoutmelding(error); setPasWaarschuwing(null); return; }
    setPendingTekst(prev => ({...prev, [pasWaarschuwing.positieId]: ''}));
    setGeselecteerdeWerknemerId(null);
    setPasWaarschuwing(null);
  };

  // Directe koppeling vanuit de suggestielijst (klik, of Tab+Enter).
  const koppelWerknemerNaam = (positieId, naam) => {
    setPendingTekst(prev => ({...prev, [positieId]: naam}));
    probeerKoppelen(positieId, true, false, naam);
  };

  // Bij het verlaten van het invoerveld (blur) wordt automatisch geprobeerd te koppelen,
  // zonder Enter nodig te hebben. Geen foutmelding bij een onvolledige/foute naam, want de
  // gebruiker klikte mogelijk per ongeluk weg.
  const handleBlurKoppel = (positieId) => probeerKoppelen(positieId, false);

  // Bij het verlaten van dit tabblad (unmount) nog één keer proberen alle nog openstaande,
  // geldig ingevulde velden te koppelen. Refs voorkomen dat de cleanup-closure met
  // verouderde data werkt (de afhankelijkheden-array van het effect blijft leeg, dus zonder
  // refs zou hij de staat van het allereerste moment van mounten gebruiken).
  const pendingTekstRef = useRef(pendingTekst);
  pendingTekstRef.current = pendingTekst;
  const positieByIdRef = useRef(positieById);
  positieByIdRef.current = positieById;
  const werknemersRef = useRef(state.werknemers);
  werknemersRef.current = state.werknemers;

  useEffect(() => {
    return () => {
      Object.keys(pendingTekstRef.current).forEach(positieId => {
        const tekst = (pendingTekstRef.current[positieId] || '').trim();
        if(!tekst) return;
        const werknemer = werknemersRef.current.find(w => naamGelijk(w.naam, tekst));
        if(!werknemer) return;
        const positie = positieByIdRef.current[positieId];
        const waarschuwing = checkBeveiligingspasWaarschuwing(positie, werknemer);
        if(waarschuwing) return; // bij twijfel niet automatisch doorzetten, vereist bevestiging
        addIndeling(positieId, werknemer.id);
      });
    };
    // eslint-disable-next-line
  }, []);

  // Eén positierij (naam/tags + gekoppelde werknemers + invoerveld) — herbruikt in zowel de
  // gegroepeerde weergave (sorteren op sectie) als de platte lijst (sorteren op naam/bezetting).
  // toonSectieLabel: in de gegroepeerde weergave staat sectie/ingang al in de kop erboven, dus
  // is die herhaling per rij daar overbodig — in de platte lijst (geen kop) blijft hij wel nodig.
  const renderPositieRow = (p, toonSectieLabel = true) => {
    const inds = indelingenPerPositie[p.id] || [];
    const vol = isVol(inds);
    return (
      <div key={p.id} style={{display:'flex', alignItems:'center', gap:12, flexWrap:'wrap', border:'1px solid var(--line)', borderRadius:4, padding:'6px 12px'}}>
        <div style={{display:'flex', alignItems:'baseline', gap:6, flexWrap:'wrap', width:230, flexShrink:0}}>
          <span style={{fontWeight:700, fontSize:14.5}}>{p.naam}</span>
          {toonSectieLabel && p.sectie && <span style={{fontSize:12, color:'var(--muted)'}}>{p.sectie}{p.ingang ? ` › ${p.ingang}` : ''}</span>}
          {(p.startTijd || p.eindTijd) && <span style={{fontSize:12, color:'var(--muted)'}}>⏱ {p.startTijd || '?'}–{p.eindTijd || '?'}</span>}
          {p.plakdienst && <Pill>Plak</Pill>}
          {p.leidinggevende && <Pill tone="signal">Leiding</Pill>}
        </div>

        <div style={{display:'flex', alignItems:'center', gap:6, flex:1, minWidth:180, flexWrap:'wrap'}}>
          {inds.map(ind => {
            const w = werknemerById[ind.werknemerId];
            return (
              <div key={ind.id} style={{display:'flex', alignItems:'center', gap:4, background:'var(--soft-bg)', border:'1px solid transparent', borderRadius:4, padding:'6px 4px 6px 10px', fontSize:14, lineHeight:'20px', fontWeight:600}}>
                <span>{w?.naam || '—'}</span>
                <button onClick={()=>removeIndeling(ind.id)} style={{background:'none', border:'none', color:'var(--warn)', cursor:'pointer', fontSize:15, lineHeight:1, padding:'0 4px'}} title="Verwijderen">×</button>
              </div>
            );
          })}
          {!vol && (
            <WerknemerVeld
              tekst={pendingTekst[p.id] || ''}
              setTekst={(t)=>setPendingTekst(prev=>({...prev, [p.id]: t}))}
              alleNamen={werknemerNamen}
              opNaamKoppelen={(naam)=>koppelWerknemerNaam(p.id, naam)}
              opTekstKoppelen={()=>handleKoppelTekst(p.id)}
              opBlurKoppelen={()=>handleBlurKoppel(p.id)}
              style={{flex:1, minWidth:160, maxWidth:260}}
            />
          )}
        </div>
      </div>
    );
  };

  return (
    <div style={{display:'grid', gap:20}}>
      {foutmelding && (
        <Card style={{borderColor:'var(--warn)', background:'var(--warn-bg)', display:'flex', justifyContent:'space-between', alignItems:'center', gap:12}}>
          <div style={{fontSize:14, color:'var(--warn)'}}>{foutmelding}</div>
          <Button variant="ghost" onClick={()=>setFoutmelding(null)}>Sluiten</Button>
        </Card>
      )}

      {dubbelGepland.length > 0 && (
        <Card style={{borderColor:'var(--warn)', background:'var(--warn-bg)'}}>
          <h3 style={{marginTop:0, fontFamily:'var(--display)', color:'var(--warn)'}}>Dubbel gepland ({dubbelGepland.length})</h3>
          <div style={{display:'grid', gap:8}}>
            {dubbelGepland.map(({werknemer, indelingen}) => (
              <div key={werknemer.id} style={{fontSize:14}}>
                <strong>{werknemer.naam}</strong> staat op {indelingen.length} posities van hetzelfde type (regulier of plakdienst):{' '}
                {indelingen.map((ind,i) => {
                  const p = positieById[ind.positieId];
                  return <span key={ind.id}>{i>0 && ', '}{p?.naam}{p?.sectie ? ` (${p.sectie})` : ''}</span>;
                })}
              </div>
            ))}
          </div>
        </Card>
      )}

      {bezettingPerSectie.length > 0 && (
        <Card>
          <h3 style={{marginTop:0, marginBottom:10, fontFamily:'var(--display)', fontSize:15}}>Bezetting per sectie</h3>
          <div style={{display:'flex', flexWrap:'wrap', gap:10}}>
            {bezettingPerSectie.map(([sectie, {bezet, totaal}]) => {
              const compleet = bezet >= totaal;
              return (
                <div key={sectie} style={{
                  display:'flex', alignItems:'center', gap:8, padding:'8px 14px', borderRadius:4,
                  border: `1px solid ${compleet ? 'var(--line)' : 'var(--warn)'}`,
                  background: compleet ? 'var(--soft-bg)' : 'var(--warn-bg)',
                  fontSize:13.5,
                }}>
                  <span style={{fontWeight:600}}>{sectie}</span>
                  <span style={{color: compleet ? 'var(--muted)' : 'var(--warn)', fontWeight:700}}>{bezet}/{totaal} bezet</span>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      <div style={{display:'flex', gap:4, background:'var(--nav-bg)', borderRadius:6, padding:4, width:'fit-content'}}>
        <button onClick={()=>setWeergave('lijst')} style={{
          padding:'7px 16px', borderRadius:4, border:'none', cursor:'pointer', fontWeight:600, fontSize:13.5, fontFamily:'var(--body)',
          background: weergave==='lijst' ? 'var(--moss)' : 'transparent', color: weergave==='lijst' ? '#fff' : 'var(--moss-dark)',
        }}>Lijst</button>
        <button onClick={()=>setWeergave('bord')} style={{
          padding:'7px 16px', borderRadius:4, border:'none', cursor:'pointer', fontWeight:600, fontSize:13.5, fontFamily:'var(--body)',
          background: weergave==='bord' ? 'var(--moss)' : 'transparent', color: weergave==='bord' ? '#fff' : 'var(--moss-dark)',
        }}>Bord</button>
      </div>

      {weergave==='lijst' && (
      <div className="two-col-layout" style={{display:'grid', gridTemplateColumns:'1fr 280px', gap:20, alignItems:'start'}}>
        <Card>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:16, flexWrap:'wrap', marginBottom:10}}>
            <h3 style={{margin:0, fontFamily:'var(--display)'}}>Posities ({gesorteerdePosities.length})</h3>
            <div style={{display:'flex', gap:10, alignItems:'center', flexWrap:'wrap'}}>
              <input style={{...inputStyle, width:220}} placeholder="Zoek positie, sectie, ingang, werknemer of organisatie…" value={query} onChange={e=>setQuery(e.target.value)} />
              <select style={{...inputStyle, width:170}} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                <option value="sectie">Sorteer: sectie</option>
                <option value="naam">Sorteer: positienaam</option>
                <option value="bezetting">Sorteer: aantal bezet</option>
              </select>
            </div>
          </div>

          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:16, flexWrap:'wrap', marginBottom:14}}>
            <Checkbox checked={verbergIngevuld} onChange={setVerbergIngevuld} label="Verberg volledig ingevulde posities" />
            {gegroepeerdVoorWeergave && (
              <div style={{display:'flex', gap:12, fontSize:12.5}}>
                <button onClick={()=>setIngeklapt({})} style={{background:'none', border:'none', color:'var(--moss-dark)', cursor:'pointer', fontWeight:600, padding:0}}>Alles uitklappen</button>
                <button onClick={()=>{
                  const alles = {};
                  gegroepeerdVoorWeergave.forEach(g => {
                    alles[g.sectie] = true;
                    g.ingangenOrder.forEach(i => { alles[`${g.sectie}||${i}`] = true; });
                  });
                  setIngeklapt(alles);
                }} style={{background:'none', border:'none', color:'var(--moss-dark)', cursor:'pointer', fontWeight:600, padding:0}}>Alles inklappen</button>
              </div>
            )}
          </div>

          {gesorteerdePosities.length===0 && <div style={{color:'var(--muted-light)'}}>Geen posities gevonden{verbergIngevuld ? ' (of alles zit al vol)' : ''}. Maak eerst posities aan.</div>}

          {gegroepeerdVoorWeergave ? (
            <div style={{display:'grid', gap:18}}>
              {gegroepeerdVoorWeergave.map(groep => {
                const sectieDicht = !!ingeklapt[groep.sectie];
                return (
                <div key={groep.sectie}>
                  <div onClick={()=>toggleIngeklapt(groep.sectie)} style={{display:'flex', alignItems:'baseline', gap:10, marginBottom:8, paddingBottom:5, borderBottom:'2px solid var(--line)', cursor:'pointer', userSelect:'none'}}>
                    <span style={{fontSize:11, color:'var(--muted)', width:12, display:'inline-block'}}>{sectieDicht ? '▸' : '▾'}</span>
                    <span style={{fontWeight:700, fontSize:15.5, fontFamily:'var(--display)'}}>{groep.sectie}</span>
                    <span style={{fontSize:12, color: groep.bezet>=groep.totaal ? 'var(--muted)' : 'var(--warn)', fontWeight:600}}>{groep.bezet}/{groep.totaal} bezet</span>
                  </div>
                  {!sectieDicht && groep.directPos.length > 0 && (
                    <div style={{display:'grid', gap:4, marginBottom: groep.ingangenOrder.length ? 12 : 0}}>
                      {groep.directPos.map(p => renderPositieRow(p, false))}
                    </div>
                  )}
                  {!sectieDicht && groep.ingangenOrder.map((ingangNaam, i) => {
                    const ingangKey = `${groep.sectie}||${ingangNaam}`;
                    const ingangDicht = !!ingeklapt[ingangKey];
                    return (
                    <div key={ingangNaam} style={{marginLeft:18, marginBottom: i < groep.ingangenOrder.length-1 ? 12 : 0}}>
                      <div onClick={()=>toggleIngeklapt(ingangKey)} style={{display:'flex', alignItems:'baseline', gap:8, fontSize:12.5, fontWeight:700, color:'var(--moss-dark)', marginBottom:5, cursor:'pointer', userSelect:'none'}}>
                        <span style={{fontSize:10, color:'var(--muted)', width:10, display:'inline-block'}}>{ingangDicht ? '▸' : '▾'}</span>
                        <span>Ingang: {ingangNaam}</span>
                        <span style={{fontWeight:600, color:'var(--muted)'}}>{groep.ingangenBezetting[ingangNaam].bezet}/{groep.ingangenBezetting[ingangNaam].totaal}</span>
                      </div>
                      {!ingangDicht && (
                        <div style={{display:'grid', gap:4}}>
                          {groep.ingangenMap[ingangNaam].map(p => renderPositieRow(p, false))}
                        </div>
                      )}
                    </div>
                    );
                  })}
                </div>
                );
              })}
            </div>
          ) : (
            <div style={{display:'grid', gap:4}}>
              {gesorteerdePosities.map(p => renderPositieRow(p))}
            </div>
          )}
        </Card>

        <Card style={{position:'sticky', top:20}}>
          <h3 style={{marginTop:0, fontFamily:'var(--display)', fontSize:15}}>Nog niet ingedeeld ({nietIngedeeldeWerknemers.length})</h3>
          <div style={{display:'grid', gap:2, maxHeight:'65vh', overflowY:'auto'}}>
            {nietIngedeeldeWerknemers.map(w => (
              <div key={w.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, fontSize:13.5, padding:'5px 0', borderBottom:'1px solid var(--line)'}}>
                <span>{w.naam}</span>
                {!w.beveiligingspas && <Pill>Geen pas</Pill>}
              </div>
            ))}
            {nietIngedeeldeWerknemers.length===0 && <div style={{color:'var(--muted-light)', fontSize:13}}>Iedereen is ingedeeld.</div>}
          </div>
        </Card>
      </div>
      )}

      {weergave==='bord' && (
      <div style={{display:'grid', gap:16}}>
        <Card>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:12, flexWrap:'wrap', marginBottom:10}}>
            <h3 style={{margin:0, fontFamily:'var(--display)', fontSize:15}}>Nog niet ingedeeld ({nietIngedeeldeWerknemers.length})</h3>
            <div style={{fontSize:12.5, color:'var(--muted)'}}>
              {geselecteerdeWerknemerId ? 'Tik nu op een positie hieronder om te koppelen.' : 'Tik een werknemer aan (of sleep hem op desktop) om te koppelen.'}
            </div>
          </div>
          <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
            {nietIngedeeldeWerknemers.map(w => {
              const actief = geselecteerdeWerknemerId === w.id;
              return (
                <button key={w.id} onClick={()=>setGeselecteerdeWerknemerId(prev => prev===w.id ? null : w.id)}
                  draggable onDragStart={e=>werknemerSlepenStart(e, w.id)}
                  style={{
                    display:'flex', alignItems:'center', gap:6, padding:'12px 18px', borderRadius:4, cursor:'grab',
                    fontSize:14.5, fontWeight:600, fontFamily:'var(--body)',
                    border: actief ? '2px solid var(--signal)' : '1px solid var(--line)',
                    background: actief ? 'var(--signal-soft)' : 'var(--card)',
                    color: actief ? 'var(--pill-signal-fg)' : 'var(--ink)',
                  }}>
                  {w.naam}
                  {!w.beveiligingspas && <Pill>Geen pas</Pill>}
                </button>
              );
            })}
            {nietIngedeeldeWerknemers.length===0 && <div style={{color:'var(--muted-light)', fontSize:13}}>Iedereen is ingedeeld.</div>}
          </div>
        </Card>

        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(240px, 1fr))', gap:14}}>
          {gesorteerdePosities.map(p => {
            const inds = indelingenPerPositie[p.id] || [];
            const vol = isVol(inds);
            const kanKoppelen = !!geselecteerdeWerknemerId && !vol;
            const sleepActiefHier = dragOverPositieId === p.id && !vol;
            return (
              <Card key={p.id}
                onClick={()=> kanKoppelen && koppelViaBord(p.id, geselecteerdeWerknemerId)}
                onDragOver={positieDragOver}
                onDragEnter={()=>setDragOverPositieId(p.id)}
                onDragLeave={()=>setDragOverPositieId(prev => prev===p.id ? null : prev)}
                onDrop={e=>positieDrop(e, p.id, vol)}
                style={{
                  cursor: kanKoppelen ? 'pointer' : 'default',
                  border: (kanKoppelen || sleepActiefHier) ? '2px dashed var(--signal)' : '1px solid var(--line)',
                  background: (kanKoppelen || sleepActiefHier) ? 'var(--signal-soft)' : 'var(--card)',
                }}>
                <div style={{display:'flex', alignItems:'baseline', gap:6, flexWrap:'wrap', marginBottom:8}}>
                  <span style={{fontWeight:700, fontSize:15}}>{p.naam}</span>
                  {p.sectie && <span style={{fontSize:12, color:'var(--muted)'}}>{p.sectie}{p.ingang ? ` › ${p.ingang}` : ''}</span>}
                  {p.plakdienst && <Pill>Plak</Pill>}
                  {p.leidinggevende && <Pill tone="signal">Leiding</Pill>}
                </div>
                <div style={{display:'grid', gap:6}}>
                  {inds.map(ind => {
                    const w = werknemerById[ind.werknemerId];
                    return (
                      <div key={ind.id} onClick={e=>e.stopPropagation()} style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:6, background:'var(--soft-bg)', borderRadius:4, padding:'8px 10px', fontSize:13.5, fontWeight:600}}>
                        <span>{w?.naam || '—'}</span>
                        <button onClick={()=>removeIndeling(ind.id)} style={{background:'none', border:'none', color:'var(--warn)', cursor:'pointer', fontSize:15, lineHeight:1, padding:'0 4px'}} title="Verwijderen">×</button>
                      </div>
                    );
                  })}
                  {inds.length===0 && (
                    <div style={{fontSize:13, color: kanKoppelen ? 'var(--signal)' : 'var(--muted-light)', fontStyle:'italic'}}>
                      {kanKoppelen ? 'Tik of sleep hier naartoe' : 'Nog niemand ingedeeld'}
                    </div>
                  )}
                  {vol && <div style={{fontSize:12, color:'var(--muted-light)'}}>Bezet</div>}
                </div>
              </Card>
            );
          })}
          {gesorteerdePosities.length===0 && <div style={{color:'var(--muted-light)'}}>Geen posities gevonden. Maak eerst posities aan.</div>}
        </div>
      </div>
      )}

      {pasWaarschuwing && (
        <div style={{
          position:'fixed', inset:0, background:'rgba(20,28,45,0.55)', display:'flex',
          alignItems:'center', justifyContent:'center', zIndex:60, padding:20
        }}>
          <Card style={{maxWidth:420, width:'100%'}}>
            <h3 style={{marginTop:0, fontFamily:'var(--display)', color:'var(--warn)'}}>Geen beveiligingspas</h3>
            <p style={{fontSize:14}}>{pasWaarschuwing.tekst}</p>
            <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
              <Button variant="ghost" onClick={()=>setPasWaarschuwing(null)}>Annuleer</Button>
              <Button variant="signal" onClick={bevestigPasWaarschuwing}>Toch koppelen</Button>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

// Combobox voor het invoerveld bij een positie: filtert werknemersnamen terwijl je typt,
// laat je met Tab door de suggesties bladeren (de tekst in het veld volgt de gemarkeerde
// suggestie) en met Enter de gemarkeerde (of enige) suggestie koppelen. Zonder markering
// valt Enter terug op het exact getypte, volledige naam (bestaand gedrag).
function WerknemerVeld({tekst, setTekst, alleNamen, opNaamKoppelen, opTekstKoppelen, opBlurKoppelen, style}){
  const [open, setOpen] = useState(false);
  const [highlight, setHighlight] = useState(-1);

  const suggesties = useMemo(() => {
    const q = tekst.trim().toLowerCase();
    if(!q) return [];
    return alleNamen.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
  }, [tekst, alleNamen]);

  const kiesSuggestie = (index) => {
    if(!suggesties[index]) return;
    setHighlight(index);
    setTekst(suggesties[index]);
  };

  const handleKeyDown = (e) => {
    if(e.key === 'Tab' && suggesties.length > 0){
      e.preventDefault();
      const volgende = highlight < suggesties.length - 1 ? highlight + 1 : 0;
      kiesSuggestie(volgende);
      return;
    }
    if(e.key === 'ArrowDown'){
      if(suggesties.length === 0) return;
      e.preventDefault();
      setOpen(true);
      kiesSuggestie(highlight < suggesties.length - 1 ? highlight + 1 : 0);
      return;
    }
    if(e.key === 'ArrowUp'){
      if(suggesties.length === 0) return;
      e.preventDefault();
      setOpen(true);
      kiesSuggestie(highlight > 0 ? highlight - 1 : suggesties.length - 1);
      return;
    }
    if(e.key === 'Enter'){
      e.preventDefault();
      if(highlight >= 0 && suggesties[highlight]) opNaamKoppelen(suggesties[highlight]);
      else if(suggesties.length === 1) opNaamKoppelen(suggesties[0]);
      else opTekstKoppelen();
      setOpen(false); setHighlight(-1);
      return;
    }
    if(e.key === 'Escape'){ setOpen(false); setHighlight(-1); }
  };

  return (
    <div style={{position:'relative', ...style}}>
      <input
        style={{...inputStyle, padding:'6px 10px', fontSize:14, lineHeight:'20px', width:'100%'}}
        placeholder="Typ naam…"
        value={tekst}
        onChange={e=>{ setTekst(e.target.value); setOpen(true); setHighlight(-1); }}
        onFocus={()=>setOpen(true)}
        onKeyDown={handleKeyDown}
        onBlur={opBlurKoppelen}
      />
      {open && suggesties.length > 0 && (
        <div style={{position:'absolute', top:'100%', left:0, right:0, marginTop:2, background:'var(--card)', border:'1px solid var(--line)', borderRadius:4, boxShadow:'0 4px 12px rgba(20,27,43,.12)', zIndex:30, maxHeight:180, overflowY:'auto'}}>
          {suggesties.map((naam, i) => (
            <div key={naam}
              onMouseDown={e=>{ e.preventDefault(); opNaamKoppelen(naam); setOpen(false); setHighlight(-1); }}
              style={{padding:'6px 10px', fontSize:13.5, cursor:'pointer', background: i===highlight ? 'var(--paper)' : 'transparent'}}>
              {naam}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- Dashboard tab (live overzicht voor leidinggevenden, bv. op een tweede scherm) ----------
function TellerBlok({label, waarde, tone}){
  const kleuren = {
    ok: 'var(--moss)', signal: 'var(--signal)', warn: 'var(--warn)', default: 'var(--muted)',
  };
  return (
    <Card style={{textAlign:'center'}}>
      <div style={{fontSize:13.5, fontWeight:600, textTransform:'uppercase', letterSpacing:'.05em', color:'var(--muted)', marginBottom:6}}>{label}</div>
      <div style={{fontFamily:'var(--display)', fontSize:56, fontWeight:700, lineHeight:1, color: kleuren[tone] || kleuren.default}}>{waarde}</div>
    </Card>
  );
}

// Puur read-only weergave, gebaseerd op dezelfde state als de rest van de app (dus altijd live,
// zonder polling nodig) — bedoeld om op een tweede monitor/beeld te zetten voor leidinggevenden.
function DashboardTab({state, positieById, werknemerById, checkinByIndelingId}){
  const [volledigScherm, setVolledigScherm] = useState(!!document.fullscreenElement);

  useEffect(() => {
    const handler = () => setVolledigScherm(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', handler);
    return () => document.removeEventListener('fullscreenchange', handler);
  }, []);

  const toggleVolledigScherm = () => {
    if(document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.();
  };

  const perSectie = useMemo(() => {
    const m = {};
    state.indelingen.forEach(ind => {
      const positie = positieById[ind.positieId];
      const sectie = positie?.sectie || '(geen sectie)';
      if(!m[sectie]) m[sectie] = {totaal:0, ingecheckt:0, nogTeGaan:0, noShow:0, uitgecheckt:0};
      const status = checkinByIndelingId[ind.id]?.status || 'gepland';
      m[sectie].totaal += 1;
      if(status==='ingecheckt') m[sectie].ingecheckt += 1;
      else if(status==='no-show') m[sectie].noShow += 1;
      else if(status==='uitgecheckt') m[sectie].uitgecheckt += 1;
      else m[sectie].nogTeGaan += 1;
    });
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  }, [state.indelingen, checkinByIndelingId, positieById]);

  const totalen = useMemo(() => {
    const t = {totaal:0, ingecheckt:0, nogTeGaan:0, noShow:0, uitgecheckt:0};
    perSectie.forEach(([, s]) => { Object.keys(t).forEach(k => t[k] += s[k]); });
    return t;
  }, [perSectie]);

  // Namen die nog niet zijn ingecheckt (status 'gepland'), voor een snel overzicht van wie er
  // nog verwacht wordt — zonder daarvoor door elke sectie-kaart te hoeven scrollen.
  const openstaandeNamen = useMemo(() => {
    return state.indelingen
      .map(ind => {
        const status = checkinByIndelingId[ind.id]?.status || 'gepland';
        if(status !== 'gepland') return null;
        const werknemer = werknemerById[ind.werknemerId];
        const positie = positieById[ind.positieId];
        if(!werknemer) return null;
        return {werknemer, positie};
      })
      .filter(Boolean)
      .sort((a,b) => a.werknemer.naam.localeCompare(b.werknemer.naam));
  }, [state.indelingen, checkinByIndelingId, werknemerById, positieById]);

  return (
    <div style={{display:'grid', gap:20}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12}}>
        <h2 style={{margin:0, fontFamily:'var(--display)'}}>{state.event.name} — Live overzicht</h2>
        <Button variant="ghost" onClick={toggleVolledigScherm}>{volledigScherm ? 'Verlaat volledig scherm' : 'Volledig scherm'}</Button>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:16}}>
        <TellerBlok label="Ingecheckt" waarde={totalen.ingecheckt} tone="ok" />
        <TellerBlok label="Nog te gaan" waarde={totalen.nogTeGaan} tone="signal" />
        <TellerBlok label="No-show" waarde={totalen.noShow} tone="warn" />
        <TellerBlok label="Uitgecheckt" waarde={totalen.uitgecheckt} tone="default" />
      </div>

      <Card>
        <h3 style={{marginTop:0, marginBottom:10, fontFamily:'var(--display)', fontSize:15}}>
          Nog niet ingecheckt ({openstaandeNamen.length})
        </h3>
        {openstaandeNamen.length === 0 ? (
          <div style={{color:'var(--muted-light)', fontSize:14}}>Iedereen is ingecheckt.</div>
        ) : (
          <div style={{display:'flex', flexWrap:'wrap', gap:8, maxHeight:180, overflowY:'auto'}}>
            {openstaandeNamen.map(({werknemer, positie}) => (
              <div key={werknemer.id} style={{
                display:'flex', alignItems:'center', gap:6, padding:'6px 12px', borderRadius:4,
                background:'var(--soft-bg)', border:'1px solid var(--line)', fontSize:13.5,
              }}>
                <strong>{werknemer.naam}</strong>
                {positie?.naam && <span style={{color:'var(--muted)'}}>· {positie.naam}</span>}
              </div>
            ))}
          </div>
        )}
      </Card>

      <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:16}}>
        {perSectie.map(([sectie, s]) => (
          <Card key={sectie}>
            <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>{sectie}</h3>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:15, padding:'4px 0'}}>
              <span>Ingecheckt</span><strong style={{color:'var(--moss)'}}>{s.ingecheckt}/{s.totaal}</strong>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:15, padding:'4px 0'}}>
              <span>Nog te gaan</span><strong style={{color:'var(--signal)'}}>{s.nogTeGaan}</strong>
            </div>
            {s.noShow > 0 && (
              <div style={{display:'flex', justifyContent:'space-between', fontSize:15, padding:'4px 0'}}>
                <span>No-show</span><strong style={{color:'var(--warn)'}}>{s.noShow}</strong>
              </div>
            )}
          </Card>
        ))}
        {perSectie.length===0 && <div style={{color:'var(--muted-light)'}}>Nog geen indelingen om te tonen.</div>}
      </div>
    </div>
  );
}

// ---------- Exports tab ----------
function ExportsTab({state, positieById, werknemerById}){

  // Knipt tekst af met '…' zodat die in de gegeven breedte past, i.p.v. jsPDF's automatische word-wrap
  // (die regels laat overlappen omdat de regelhoogte vast is).
  const fitText = (doc, text, maxWidth) => {
    if(!text) return '';
    if(doc.getTextWidth(text) <= maxWidth) return text;
    let truncated = text;
    while(truncated.length > 1 && doc.getTextWidth(truncated + '…') > maxWidth){
      truncated = truncated.slice(0, -1);
    }
    return truncated + '…';
  };


  const sectieGroepen = useMemo(() => {
    const m = {};
    state.posities.forEach(p => {
      const key = p.sectie || '(geen sectie)';
      if(!m[key]) m[key] = [];
      m[key].push(p);
    });
    return m;
  }, [state.posities]);

  // Aantal unieke ingangen (sectie+ingang-combinatie), voor de omschrijving bij de export per ingang.
  const aantalIngangen = useMemo(() => {
    const set = new Set();
    state.posities.forEach(p => { if(p.ingang) set.add((p.sectie||'') + '||' + p.ingang); });
    return set.size;
  }, [state.posities]);

  // ----- Inzetlijst (PDF, 2 kolommen, alfabetisch) -----
  // alleenIngevuld: bij true worden posities zonder gekoppelde werknemer overgeslagen,
  // zodat dit een overzicht wordt van alleen de daadwerkelijk ingevulde posities.
  const bouwEnExporteerInzetlijst = (alleenIngevuld) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 36;
    const gutter = 24;
    const colWidth = (pageW - margin*2 - gutter) / 2;
    const colXs = [margin, margin + colWidth + gutter];
    // Eén regel per item (positie + werknemer) — geen tijden op de inzetlijst, dat is een
    // planningsdocument, geen invulformulier.
    const itemHeight = 16;
    const sectionGap = 12;

    const sectieNamenAlfabetisch = Object.keys(sectieGroepen).sort((a,b)=>a.localeCompare(b));

    // Leidinggevenden komen eerst te staan binnen hun sectie/ingang, de rest daarna op alfabet.
    const sorteerLeidingEerst = (a,b) => (b.leidinggevende?1:0) - (a.leidinggevende?1:0) || a.naam.localeCompare(b.naam);

    // Ingangen krijgen dezelfde breedte als een sector (geen inspringing) — het verschil zit
    // 'm in de koptekst zelf (kleiner, met "Ingang:"-label en stippellijn i.p.v. doorgetrokken
    // lijn), niet in minder ruimte voor de inhoud.
    const naamXOffset = Math.min(colWidth*0.52, 130);
    const posLabelW = naamXOffset - 19;

    // Lange positienamen krijgen een tweede regel i.p.v. te worden afgekapt met '…'.
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    const wrapPosLabel = (p) => {
      const posLabel = p.naam;
      let lines = doc.splitTextToSize(posLabel, posLabelW);
      if(lines.length > 2) lines = [lines[0], fitText(doc, lines.slice(1).join(' '), posLabelW)];
      return lines;
    };

    const buildItems = (posList) => {
      const items = [];
      posList.forEach(p => {
        const lines = wrapPosLabel(p);
        const rowH = itemHeight + (lines.length > 1 ? 9 : 0);
        const pushItem = (werknemerNaam) => items.push({positie: p, werknemerNaam, lines, rowH});
        const inds = state.indelingen.filter(ind => ind.positieId === p.id);
        if(inds.length === 0){
          if(!alleenIngevuld) pushItem('');
        } else {
          inds.forEach(ind => pushItem(werknemerById[ind.werknemerId]?.naam || ''));
        }
      });
      return items;
    };

    const sectieHeaderH = 20;
    // Extra ademruimte vóór elke ingang-kop, zodat opeenvolgende ingangen binnen dezelfde sector
    // niet claustrofobisch tegen elkaar aan staan.
    const ingangGapBoven = 10;
    const ingangHeaderH = 16 + ingangGapBoven;

    // Bouw een vlakke lijst van "regels": Sector (kop 1) — eerst de posities zonder ingang,
    // daarna per ingang (kop 2) de posities die daaronder vallen. Zo is in het document meteen
    // te zien wie waar onder valt.
    const regels = [];
    sectieNamenAlfabetisch.forEach(sectieNaam => {
      const posInSectie = sectieGroepen[sectieNaam];
      const directPos = posInSectie.filter(p => !p.ingang).sort(sorteerLeidingEerst);
      const directItems = buildItems(directPos);

      const ingangMap = {};
      posInSectie.filter(p => p.ingang).forEach(p => {
        (ingangMap[p.ingang] = ingangMap[p.ingang] || []).push(p);
      });
      const ingangBlokken = Object.keys(ingangMap).sort((a,b)=>a.localeCompare(b)).map(ingangNaam => ({
        ingangNaam,
        items: buildItems([...ingangMap[ingangNaam]].sort(sorteerLeidingEerst)),
      })).filter(blok => blok.items.length > 0);

      if(directItems.length === 0 && ingangBlokken.length === 0) return;

      regels.push({type:'sectie', naam: sectieNaam});
      directItems.forEach(item => regels.push({type:'item', item}));
      ingangBlokken.forEach(blok => {
        // Een ingang blijft altijd volledig bij elkaar op één kolom/pagina — een beetje
        // witruimte onderin een kolom is minder erg dan een ingang die in tweeën knipt.
        const blokHeight = ingangHeaderH + blok.items.reduce((s,it)=>s+it.rowH, 0);
        regels.push({type:'ingang', naam: blok.ingangNaam, blokHeight});
        blok.items.forEach(item => regels.push({type:'item', item}));
      });
      regels.push({type:'gap'});
    });

    let col = 0;
    let y = margin;
    let x = colXs[0];

    // Logo rechtsboven, op dezelfde hoogte als de titel.
    const logoH = 26;
    const logoW = logoH * LOGO_ASPECT_RATIO;
    try { doc.addImage(LOGO_BASE64, 'PNG', pageW - margin - logoW, y - logoH + 6, logoW, logoH); } catch(e){ /* logo kon niet geladen worden */ }

    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    const titelTekst = state.event.name + (alleenIngevuld ? ' — Inzetlijst (ingevuld)' : ' — Inzetlijst');
    doc.text(fitText(doc, titelTekst, pageW - margin*2 - logoW - 10), margin, y);
    y += 22;
    doc.setLineWidth(0.75);
    doc.line(margin, y, pageW - margin, y);
    y += 20;
    let colTopY = y;

    const ensureSpace = (needed) => {
      if(y + needed > pageH - margin){
        if(col === 0){
          col = 1; x = colXs[1]; y = colTopY;
        } else {
          doc.addPage();
          col = 0; x = colXs[0]; y = margin; colTopY = margin;
        }
      }
    };

    // Tekent één item-regel (positie + werknemer).
    const tekenItem = (item) => {
      ensureSpace(item.rowH);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      doc.setLineWidth(0.6);
      doc.rect(x, y - 7.5, 8, 8);
      if(item.positie.vereistPortofoon){
        doc.setLineWidth(1);
        doc.line(x+1.3, y-3.5, x+3.3, y-1.3);
        doc.line(x+3.3, y-1.3, x+6.8, y-6.8);
      }
      const labelX = x + 13;
      const naamX = x + naamXOffset;
      item.lines.forEach((line, i) => doc.text(line, labelX, y + i*10));
      doc.text(fitText(doc, item.werknemerNaam || '—', x + colWidth - naamX), naamX, y);
      y += item.rowH;
    };

    regels.forEach(regel => {
      if(regel.type === 'sectie'){
        // Reserveer alleen ruimte voor de kop + minstens één regel eronder (niet de hele,
        // mogelijk lange, sectie-inhoud) — anders springt een grote sectie altijd naar een
        // nieuwe kolom/pagina, ook als er in de huidige kolom nog volop ruimte over is.
        ensureSpace(sectieHeaderH + itemHeight);
        // Sector = kop 1: alleen de naam, geen tijden — dit is een groepslabel, geen in te vullen regel.
        doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
        doc.text(fitText(doc, regel.naam, colWidth), x, y);
        y += 6;
        doc.setLineWidth(0.5);
        doc.line(x, y, x + colWidth, y);
        y += 14;
      } else if(regel.type === 'ingang'){
        // Een ingang reserveert zijn volledige hoogte in één keer, zodat hij nooit over een
        // kolom/pagina-grens gesplitst wordt (zie regels-opbouw hierboven).
        ensureSpace(Math.min(regel.blokHeight, pageH - margin - colTopY));
        y += ingangGapBoven;
        // Ingang = kop 2: zelfde breedte als een sector, maar lichter en met stippellijn
        // i.p.v. een doorgetrokken lijn — dát is het visuele onderscheid.
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
        doc.text(fitText(doc, 'Ingang: ' + regel.naam, colWidth), x, y);
        y += 5;
        doc.setLineWidth(0.4);
        doc.setLineDashPattern([1,1.4], 0);
        doc.line(x, y, x + colWidth, y);
        doc.setLineDashPattern([], 0);
        y += 11;
      } else if(regel.type === 'item'){
        tekenItem(regel.item);
      } else if(regel.type === 'gap'){
        y += sectionGap;
      }
    });

    doc.save(`${state.event.name.replace(/\s+/g,'_')}_inzetlijst${alleenIngevuld ? '_ingevuld' : ''}.pdf`);
  };

  const exportTotaaloverzicht = () => bouwEnExporteerInzetlijst(false);
  const exportIngevuldeInzetlijst = () => bouwEnExporteerInzetlijst(true);

  // ----- Inzetformulier (PDF), gedeelde pagina-opbouw -----
  // Leidinggevenden vandaag = ALLE indelingen met het vinkje 'leidinggevende', over alle secties heen (niet sectie-gebonden).
  // Werknemers in het vak = de indelingen die voor déze pagina meetellen (hele sectie, of maar één ingang).
  // Pagina 1: alleen sector/ingang, algemeen, werknemers in het vak (volle breedte) en checklist/feedback.
  // Pagina 2: leidinggevenden vandaag + aantekeningen-ruimte voor de leidinggevende zelf.
  const tekenInzetformulierPagina = (doc, {margin, pageW, pageH, ins, titel, ondertitel, leidinggevenden, vakWerknemers}) => {
      const contentW = pageW - margin*2;
      const logoH = 26;
      const logoW = logoH * LOGO_ASPECT_RATIO;
      const titelMaxW = pageW - margin - (margin + logoW + 10);

      // Header met logo, ingang-titel en sector-ondertitel — identiek op beide pagina's, zodat
      // losse pagina's altijd nog te herleiden zijn tot hun ingang.
      const tekenHeader = () => {
        let y = margin;
        try { doc.addImage(LOGO_BASE64, 'PNG', margin, y - logoH + 6, logoW, logoH); } catch(e){ /* logo kon niet geladen worden */ }
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        doc.text(fitText(doc, titel, titelMaxW), pageW - margin, y, {align:'right'});
        // Bij een ondertitel (sectienaam onder de ingang-titel) moet de scheidingslijn ONDER die
        // tweede tekstregel komen, anders snijdt de lijn er dwars doorheen.
        if(ondertitel){
          doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
          doc.text(fitText(doc, ondertitel, titelMaxW), pageW - margin, y + 13, {align:'right'});
          y += 20;
        } else {
          y += 10;
        }
        doc.setLineWidth(1);
        doc.line(margin, y, pageW - margin, y);
        return y + 24;
      };

      // ---------- Pagina 1 ----------
      let y = tekenHeader();

      // Algemeen: geen sectiekopje meer — direct de velden zelf, met een kleine kop per veld
      // boven de waarde. Rustiger en ruimtelijker dan de vorige ingekaderde variant.
      const algemeenColW = contentW * 0.5 - 10;
      const datumWeergave = state.event.date ? new Date(state.event.date + 'T00:00:00').toLocaleDateString('nl-NL', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
      doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.setTextColor(130);
      doc.text(fitText(doc, ins.naamLabel, algemeenColW).toUpperCase(), margin, y);
      doc.text('DATUM', margin + algemeenColW + 20, y);
      doc.setTextColor(0);
      y += 15;
      doc.setFont('helvetica','normal'); doc.setFontSize(12.5);
      doc.text(fitText(doc, state.event.name, algemeenColW), margin, y);
      doc.text(datumWeergave, margin + algemeenColW + 20, y);
      y += 30;

      // Werknemers in het vak: nu de volle breedte (leidinggevenden staan op pagina 2), als
      // een echte tabel — grijze kopregel, dunne kolomlijnen en lichte zebra-vulling. Alles in
      // grijstinten (geen kleur) zodat het ook in zwart-wit goed leesbaar blijft.
      const timeBlockW = 100; // ~1.4x breder dan voorheen (72), zodat Begin/Eind meer ruimte krijgen; Naam wordt evenredig smaller.
      const timeBlockX = margin + contentW - timeBlockW;
      const roleW = Math.min(contentW*0.30, 170);
      const col2X = margin + 13 + roleW;
      const nameW = timeBlockX - 10 - col2X;
      const div1X = col2X - 7;
      const div2X = timeBlockX - 7;
      const headRowH = 20;
      const rowH = 18;
      // Precies drie lege rijen extra om ná het printen nog handmatig aan te vullen — geen
      // vaste minimumhoogte meer, dit schaalt puur met het aantal al ingevulde posities.
      const rowsCount = vakWerknemers.length + 3;

      doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text(fitText(doc, ins.werknemersTitel, contentW), margin, y);
      y += 14;

      const tabel1Top = y;
      doc.setFillColor(222,222,222);
      doc.rect(margin, y, contentW, headRowH, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0);
      const headBaseline = y + headRowH/2 + 3;
      doc.text('Positie', margin + 13, headBaseline);
      doc.text('Naam', col2X, headBaseline);
      doc.text('Begin', timeBlockX, headBaseline);
      doc.text('Eind', timeBlockX + 53, headBaseline);
      y += headRowH;

      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      for(let i=0;i<rowsCount;i++){
        const rowTop = y;
        if(i % 2 === 1){
          doc.setFillColor(245,245,245);
          doc.rect(margin, rowTop, contentW, rowH, 'F');
        }
        const baseline = rowTop + rowH - 6;
        doc.setLineWidth(0.6);
        doc.rect(margin + 13, rowTop + rowH/2 - 4, 8, 8);
        if(i < vakWerknemers.length){
          const ind = vakWerknemers[i];
          const p = positieById[ind.positieId];
          const w = werknemerById[ind.werknemerId];
          doc.text(fitText(doc, p?.naam || '', roleW - 19), margin + 26, baseline);
          doc.text(fitText(doc, w?.naam || '', nameW), col2X, baseline);
        }
        doc.setLineWidth(0.5);
        doc.setLineDashPattern([1,1.4], 0);
        doc.line(timeBlockX, baseline+3, timeBlockX + 44, baseline+3);
        doc.line(timeBlockX + 56, baseline+3, timeBlockX + timeBlockW, baseline+3);
        doc.setLineDashPattern([], 0);
        y += rowH;
      }
      const tabel1Bottom = y;
      doc.setDrawColor(120); doc.setLineWidth(0.75);
      doc.rect(margin, tabel1Top, contentW, tabel1Bottom - tabel1Top);
      doc.setDrawColor(195); doc.setLineWidth(0.5);
      doc.line(div1X, tabel1Top, div1X, tabel1Bottom);
      doc.line(div2X, tabel1Top, div2X, tabel1Bottom);
      doc.setDrawColor(0);
      y += 16;

      // Checklist
      doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text('Checklist voor de wedstrijd', margin, y);
      y += 18;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      (ins.checklistItems || DEFAULT_CHECKLIST).forEach(item => {
        doc.setLineWidth(0.6);
        doc.rect(margin, y-7.5, 8, 8);
        doc.text(fitText(doc, item, contentW - 14), margin + 14, y);
        y += 15.5;
      });
      y += 12;

      // Feedback boxes vullen de resterende ruimte op de pagina — schaalbaar in plaats van een
      // vaste (gemaximeerde) hoogte, zodat de vrijgekomen ruimte van een kortere werknemerslijst
      // hierheen doorstroomt in plaats van als lege pagina onderin te blijven staan.
      const remaining = pageH - margin - y;
      const feedbackBoxH = Math.max(50, (remaining - 38) / 2);
      const feedbackLineGap = 16;

      const drawFeedbackBox = (titel, boxY) => {
        doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
        doc.text(fitText(doc, titel, contentW), margin, boxY);
        const topY = boxY + 8;
        doc.setLineWidth(1);
        doc.rect(margin, topY, contentW, feedbackBoxH);
        doc.setLineWidth(0.4);
        doc.setLineDashPattern([1,1.2], 0);
        let lineY = topY + feedbackLineGap;
        while(lineY < topY + feedbackBoxH - 6){
          doc.line(margin + 8, lineY, margin + contentW - 8, lineY);
          lineY += feedbackLineGap;
        }
        doc.setLineDashPattern([], 0);
        return topY + feedbackBoxH;
      };

      const afterExtern = drawFeedbackBox(ins.feedbackTitelExtern, y);
      y = afterExtern + 22;
      drawFeedbackBox(ins.feedbackTitelIntern, y);

      // ---------- Pagina 2: leidinggevenden vandaag + aantekeningen ----------
      doc.addPage();
      y = tekenHeader();

      doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text(fitText(doc, ins.leidinggevendenTitel, contentW), margin, y);
      y += 14;

      if(leidinggevenden.length === 0){
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        doc.setTextColor(130);
        doc.text('Geen leidinggevenden gevonden.', margin, y);
        doc.setTextColor(0);
        y += 20;
      } else {
        // Zelfde tabelstijl als "Werknemers in het vak" op pagina 1: grijze kopregel, lichte
        // zebra-vulling, dunne kolomlijn — en dezelfde lettergrootte als de rest (9.5, niet groter).
        const roleW2 = Math.min(contentW*0.42, 230);
        const div3X = margin + roleW2 - 7;
        const headRowH2 = 20;
        const rowH2 = 18;
        const tabel2Top = y;

        doc.setFillColor(222,222,222);
        doc.rect(margin, y, contentW, headRowH2, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0);
        const headBaseline2 = y + headRowH2/2 + 3;
        doc.text('Positie', margin + 13, headBaseline2);
        doc.text('Naam', margin + roleW2, headBaseline2);
        y += headRowH2;

        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        leidinggevenden.forEach((ind, i) => {
          const rowTop = y;
          if(i % 2 === 1){
            doc.setFillColor(245,245,245);
            doc.rect(margin, rowTop, contentW, rowH2, 'F');
          }
          const baseline2 = rowTop + rowH2 - 6;
          const p = positieById[ind.positieId];
          const w = werknemerById[ind.werknemerId];
          const rolLabel = (p?.naam || '') + (p?.sectie ? ` (${p.sectie}${p.ingang ? ' › ' + p.ingang : ''})` : '');
          doc.text(fitText(doc, rolLabel, roleW2 - 20), margin + 13, baseline2);
          doc.text(fitText(doc, w?.naam || '', contentW - roleW2 - 13), margin + roleW2, baseline2);
          y += rowH2;
        });
        const tabel2Bottom = y;
        doc.setDrawColor(120); doc.setLineWidth(0.75);
        doc.rect(margin, tabel2Top, contentW, tabel2Bottom - tabel2Top);
        doc.setDrawColor(195); doc.setLineWidth(0.5);
        doc.line(div3X, tabel2Top, div3X, tabel2Bottom);
        doc.setDrawColor(0);
      }
      y += 16;

      // Aantekeningen: de rest van de pagina vult zich met stippellijnen om ter plekke te
      // kunnen schrijven — bewust geen vaste hoogte, dit gebruikt gewoon de resterende ruimte.
      doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
      doc.text('Aantekeningen', margin, y);
      y += 22;
      doc.setLineWidth(0.4);
      doc.setLineDashPattern([1,1.4], 0);
      const notitieRegelGap = 24;
      while(y < pageH - margin){
        doc.line(margin, y, pageW - margin, y);
        y += notitieRegelGap;
      }
      doc.setLineDashPattern([], 0);
  };

  // Eén pagina per ingang: alleen posities die aan een ingang zijn gekoppeld krijgen een
  // inzetformulier (posities rechtstreeks in een sector, zonder ingang, komen alleen in de
  // Inzetlijst terug). Rechterkolom = alle posities die onder die ene ingang vallen, over
  // eventueel meerdere posities heen — zo kan een hoofdsteward precies zijn eigen ingang krijgen.
  const exportWedstrijdformulierenPerIngang = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 42;
    const ins = state.instellingen;

    // Alfabetisch op sectie, dan op ingang (posities zonder ingang komen vanzelf eerst — een
    // lege string sorteert vóór elke naam), zodat de leidinggevenden-lijst op pagina 2 overzichtelijk
    // gegroepeerd oogt in plaats van in willekeurige volgorde te staan.
    const alleLeidinggevenden = state.indelingen
      .filter(ind => positieById[ind.positieId]?.leidinggevende)
      .sort((a,b) => {
        const pa = positieById[a.positieId], pb = positieById[b.positieId];
        return (pa?.sectie||'').localeCompare(pb?.sectie||'')
          || (pa?.ingang||'').localeCompare(pb?.ingang||'')
          || (pa?.naam||'').localeCompare(pb?.naam||'');
      });

    const ingangGroepen = {}; // key "sectie||ingang" -> {sectie, ingang, posIds:Set}
    state.posities.forEach(p => {
      if(!p.ingang) return;
      const key = (p.sectie||'') + '||' + p.ingang;
      if(!ingangGroepen[key]) ingangGroepen[key] = {sectie: p.sectie||'', ingang: p.ingang, posIds: new Set()};
      ingangGroepen[key].posIds.add(p.id);
    });
    const ingangenSorted = Object.values(ingangGroepen).sort((a,b) =>
      a.sectie.localeCompare(b.sectie) || a.ingang.localeCompare(b.ingang));

    ingangenSorted.forEach((groep, i) => {
      if(i > 0) doc.addPage();
      const vakWerknemers = state.indelingen.filter(ind => groep.posIds.has(ind.positieId));
      tekenInzetformulierPagina(doc, {
        margin, pageW, pageH, ins, titel: groep.ingang, ondertitel: groep.sectie || null,
        leidinggevenden: alleLeidinggevenden, vakWerknemers,
      });
    });

    doc.save(`${state.event.name.replace(/\s+/g,'_')}_inzetformulier_per_ingang.pdf`);
  };

  // ----- In-/uitchecktijden (PDF), voor controle -----
  // Vergelijkt de werkelijke in-/uitchecktijd met de geplande start-/eindtijd van de positie, zodat
  // afwijkingen (en no-shows) meteen opvallen in de export en de planning weet wat nagekeken moet worden.
  const bepaalAfwijking = (status, inTijd, uitTijd, gplStart, gplEind) => {
    if(status === 'no-show') return 'NO-SHOW';
    const meldingen = [];
    if(gplStart && inTijd && inTijd !== gplStart) meldingen.push('inchecktijd wijkt af');
    if(gplEind && uitTijd && uitTijd !== gplEind) meldingen.push('uitchecktijd wijkt af');
    return meldingen.length ? `⚠ AFWIJKING: ${meldingen.join(' & ')}` : '';
  };

  const exportChecktijden = () => {
    const rows = state.indelingen.map(ind => {
      const p = positieById[ind.positieId];
      const w = werknemerById[ind.werknemerId];
      const c = state.checkins.find(c=>c.indelingId===ind.id);
      const statusLabel = {'gepland':'Gepland','ingecheckt':'Ingecheckt','uitgecheckt':'Uitgecheckt','no-show':'No-show'}[c?.status] || 'Gepland';
      return {
        'Werknemer': w?.naam || '—',
        'Organisatie': w?.organisatie || '',
        'Positie': p?.naam || '—',
        'Sectie': p?.sectie || '—',
        'Geplande starttijd': p?.startTijd || '',
        'Geplande eindtijd': p?.eindTijd || '',
        'Incheck tijd': c?.inTijd || '',
        'Uitcheck tijd': c?.uitTijd || '',
        'Status': statusLabel,
        'Let op': bepaalAfwijking(c?.status, c?.inTijd, c?.uitTijd, p?.startTijd, p?.eindTijd),
        'Opmerking bij uitchecken': c?.opmerking || '',
      };
    }).sort((a,b) => a['Werknemer'].localeCompare(b['Werknemer']));

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      {wch:24}, // Werknemer
      {wch:20}, // Organisatie
      {wch:24}, // Positie
      {wch:20}, // Sectie
      {wch:16}, // Geplande starttijd
      {wch:16}, // Geplande eindtijd
      {wch:12}, // Incheck tijd
      {wch:12}, // Uitcheck tijd
      {wch:14}, // Status
      {wch:34}, // Let op
      {wch:40}, // Opmerking
    ];
    // Auto-filter op alle kolommen zodat de planning in Excel direct op de 'Let op'-kolom kan filteren.
    ws['!autofilter'] = {ref: ws['!ref']};

    // Markeer elke afwijkende rij (tijd wijkt af van gepland, of no-show) geel, zodat het ook
    // opvalt zonder te filteren. Werkt via xlsx-js-style (zie de <script>-tag hierboven) — de
    // gratis SheetJS-build zelf schrijft celopmaak niet weg.
    const geleVulling = {fill: {patternType:'solid', fgColor:{rgb:'FFF9C4'}, bgColor:{rgb:'FFF9C4'}}};
    const kolomBereik = XLSX.utils.decode_range(ws['!ref']);
    rows.forEach((rij, i) => {
      if(!rij['Let op']) return;
      const rijIndex = i + 1; // +1: rij 0 is de headerrij
      for(let col = kolomBereik.s.c; col <= kolomBereik.e.c; col++){
        const adres = XLSX.utils.encode_cell({r: rijIndex, c: col});
        if(ws[adres]) ws[adres].s = geleVulling;
      }
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Checktijden');
    XLSX.writeFile(wb, `${state.event.name.replace(/\s+/g,'_')}_checktijden.xlsx`);
  };

  return (
    <div style={{display:'grid', gap:20}}>
      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Inzetlijst</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>
          Alle secties alfabetisch, in twee kolommen op A4. Per sector (kop 1) staan eerst de posities die rechtstreeks
          in die sector vallen (geen ingang toegewezen), en daarna per ingang (kop 2) de posities die daaronder vallen — zo zie je in
          één oogopslag wie waaronder valt. Elke positie toont de werknemer, leiding-aanduiding en portofoon-vinkje. Dit is een
          planningsoverzicht zonder tijden — voor tijden om in te vullen, gebruik het inzetformulier per ingang hieronder.
        </p>
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <Button onClick={exportTotaaloverzicht} disabled={state.posities.length===0}>Exporteer inzetlijst (.pdf)</Button>
          <Button variant="ghost" onClick={exportIngevuldeInzetlijst} disabled={state.indelingen.length===0}>Exporteer alleen ingevulde posities (.pdf)</Button>
        </div>
      </Card>

      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Inzetformulier per ingang</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>
          Eén PDF met twee pagina's per ingang ({aantalIngangen} ingangen gevonden), in het Scorpions Security formaat. Pagina 1:
          algemeen, alle werknemers van die ene ingang met begin/eind-stippellijn, checklist en feedbackvelden. Pagina 2: alle
          leidinggevenden van de hele dag (over alle secties) plus ruimte met stippellijnen voor aantekeningen. Teksten hiervan
          zijn aan te passen in de tab Edit. Posities zonder ingang (rechtstreeks in een sector) krijgen geen eigen formulier —
          die staan alleen in de Inzetlijst hierboven.
        </p>
        <Button onClick={exportWedstrijdformulierenPerIngang} disabled={aantalIngangen===0}>Exporteer inzetformulier per ingang (.pdf)</Button>
      </Card>

      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Incheck- en uitchecktijden</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>Overzicht van alle werknemers met hun in- en uitchecktijd, status en eventuele opmerking, op naam gesorteerd, als Excel-bestand om te controleren of alles klopt. Wijkt de incheck- of uitchecktijd af van de geplande start-/eindtijd van de positie (of is iemand een no-show), dan wordt die hele rij geel gemarkeerd en staat de reden in de kolom "Let op" — filter daarop om snel te zien wat de planning nog moet nalopen.</p>
        <Button onClick={exportChecktijden} disabled={state.indelingen.length===0}>Exporteer checktijden (.xlsx)</Button>
      </Card>
    </div>
  );
}

// ---------- Edit tab ----------
function EditTab({instellingen, setState}){
  const update = (patch) => setState(s => ({...s, instellingen: {...s.instellingen, ...patch}}));

  const [newItem, setNewItem] = useState('');
  const [newMateriaal, setNewMateriaal] = useState('');

  const updateChecklistItem = (idx, value) => {
    const items = [...instellingen.checklistItems];
    items[idx] = value;
    update({checklistItems: items});
  };
  const removeChecklistItem = (idx) => {
    update({checklistItems: instellingen.checklistItems.filter((_,i)=>i!==idx)});
  };
  const addChecklistItem = () => {
    if(!newItem.trim()) return;
    update({checklistItems: [...instellingen.checklistItems, newItem.trim()]});
    setNewItem('');
  };

  return (
    <div style={{display:'grid', gap:20}}>
      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Vaste labels op het inzetformulier</h3>
        <p style={{fontSize:12.5, color:'var(--muted)', marginTop:-8}}>Het Scorpions Security logo staat vast linksboven op elk formulier.</p>
        <Field label="Label voor 'Evenement/wedstrijd' veld">
          <input style={inputStyle} value={instellingen.naamLabel} onChange={e=>update({naamLabel:e.target.value})} />
        </Field>
        <Field label="Titel leidinggevenden (pagina 2)">
          <input style={inputStyle} value={instellingen.leidinggevendenTitel} onChange={e=>update({leidinggevendenTitel:e.target.value})} />
        </Field>
        <Field label="Titel werknemers in het vak (pagina 1)">
          <input style={inputStyle} value={instellingen.werknemersTitel} onChange={e=>update({werknemersTitel:e.target.value})} />
        </Field>
        <Field label="Titel extern feedbackvlak">
          <input style={inputStyle} value={instellingen.feedbackTitelExtern} onChange={e=>update({feedbackTitelExtern:e.target.value})} />
        </Field>
        <Field label="Titel intern feedbackvlak">
          <input style={inputStyle} value={instellingen.feedbackTitelIntern} onChange={e=>update({feedbackTitelIntern:e.target.value})} />
        </Field>
      </Card>

      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Checklist voor de wedstrijd</h3>
        <div style={{display:'grid', gap:8, marginBottom:14}}>
          {instellingen.checklistItems.map((item, idx) => (
            <div key={idx} style={{display:'flex', gap:8}}>
              <input style={inputStyle} value={item} onChange={e=>updateChecklistItem(idx, e.target.value)} />
              <Button variant="danger" onClick={()=>removeChecklistItem(idx)}>Verwijderen</Button>
            </div>
          ))}
          {instellingen.checklistItems.length===0 && <div style={{color:'var(--muted-light)'}}>Geen checklist-items.</div>}
        </div>
        <div style={{display:'flex', gap:8}}>
          <input style={inputStyle} placeholder="Nieuw checklist-item" value={newItem} onChange={e=>setNewItem(e.target.value)} />
          <Button onClick={addChecklistItem}>Toevoegen</Button>
        </div>
      </Card>

      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Materiaal-macrolijst (snelkeuze bij in-/uitchecken)</h3>
        <p style={{fontSize:13, color:'var(--muted)', marginTop:0}}>Deze opties verschijnen als genummerde knoppen bij het in- en uitchecken aan de balie, naast het materiaal dat al automatisch per positie wordt voorgesteld.</p>
        <div style={{display:'grid', gap:8, marginBottom:14}}>
          {(instellingen.materiaalOpties||[]).map((item, idx) => (
            <div key={idx} style={{display:'flex', gap:8, alignItems:'center'}}>
              <div style={{width:24, textAlign:'right', fontSize:13, color:'var(--muted-light)'}}>{idx+1}.</div>
              <input style={inputStyle} value={item} onChange={e=>{
                const items = [...(instellingen.materiaalOpties||[])];
                items[idx] = e.target.value;
                update({materiaalOpties: items});
              }} />
              <Button variant="danger" onClick={()=>update({materiaalOpties:(instellingen.materiaalOpties||[]).filter((_,i)=>i!==idx)})}>Verwijderen</Button>
            </div>
          ))}
          {(!instellingen.materiaalOpties || instellingen.materiaalOpties.length===0) && <div style={{color:'var(--muted-light)'}}>Geen materiaalopties.</div>}
        </div>
        <div style={{display:'flex', gap:8}}>
          <input style={inputStyle} placeholder="Nieuw materiaal" value={newMateriaal} onChange={e=>setNewMateriaal(e.target.value)} />
          <Button onClick={()=>{ if(newMateriaal.trim()){ update({materiaalOpties:[...(instellingen.materiaalOpties||[]), newMateriaal.trim()]}); setNewMateriaal(''); } }}>Toevoegen</Button>
        </div>
      </Card>

      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Bonnetje (printbon bij inchecken)</h3>
        <Field label="Accentkleur">
          <div style={{display:'flex', gap:10, alignItems:'center'}}>
            <input type="color" value={instellingen.bonAccentkleur || '#303F62'}
              onChange={e=>update({bonAccentkleur: e.target.value})}
              style={{width:44, height:36, padding:2, border:'1px solid var(--line)', borderRadius:4, cursor:'pointer'}} />
            <input style={{...inputStyle, maxWidth:140}} value={instellingen.bonAccentkleur || '#303F62'}
              onChange={e=>update({bonAccentkleur: e.target.value})} />
          </div>
        </Field>
        <Field label="Voettekst onderaan de bon">
          <input style={inputStyle} value={instellingen.bonVoettekst || ''} onChange={e=>update({bonVoettekst: e.target.value})} />
        </Field>
        <Field label="Lettergrootte (pt)">
          <input type="number" min="6" max="24" style={{...inputStyle, width:70}}
            value={instellingen.bonLettergrootte || 11}
            onChange={e=>update({bonLettergrootte: Number(e.target.value) || 11})} />
        </Field>
      </Card>
    </div>
  );
}


function DataTab({state, setState, exportJSON, importJSONFile, importJSONMetHandle, ondersteuntBestandsToegang, importedFileHandle, loskoppelenGeimporteerdBestand, laatsteAutosave}){
  const fileRef = useRef(null);

  // Alleen checkins meetellen die nog bij een bestaande indeling horen — checkins van
  // inmiddels verwijderde posities/werknemers mogen hier niet in de tellingen meekomen.
  const geldigeIndelingIds = new Set(state.indelingen.map(i=>i.id));
  const geldigeCheckins = state.checkins.filter(c=>geldigeIndelingIds.has(c.indelingId));
  const totaalIndelingen = state.indelingen.length;
  const ingecheckt = geldigeCheckins.filter(c=>c.status==='ingecheckt').length;
  const uitgecheckt = geldigeCheckins.filter(c=>c.status==='uitgecheckt').length;
  const noShow = geldigeCheckins.filter(c=>c.status==='no-show').length;
  const nogTeGaan = totaalIndelingen - ingecheckt - uitgecheckt - noShow;

  return (
    <div className="two-col-layout" style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24}}>
      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Evenement</h3>
        <Field label="Evenement / wedstrijd">
          <input style={inputStyle} value={state.event.name} onChange={e=>setState(s=>({...s, event:{...s.event, name:e.target.value}}))} />
        </Field>
        <Field label="Datum">
          <input style={inputStyle} type="date" value={state.event.date} onChange={e=>setState(s=>({...s, event:{...s.event, date:e.target.value}}))} />
        </Field>
      </Card>

      <Card>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Bewaren & laden</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>
          Elke 30 minuten wordt gecontroleerd of er opgeslagen moet worden: is er een gekoppeld bestand, dan wordt daar
          stil naar teruggeschreven; is dat er niet, dan verschijnt bovenin een melding die vraagt of je handmatig wilt opslaan.
          {laatsteAutosave ? <> Laatste keer opgeslagen: <strong>{laatsteAutosave}</strong>.</> : ' Nog niet opgeslagen in deze sessie.'}
          {' '}Exporteer ook handmatig als je zeker wilt zijn, en laad een bestand weer in om verder te gaan op een ander moment.
        </p>
        {importedFileHandle ? (
          <p style={{fontSize:13.5, color:'var(--moss-dark)', background:'var(--paper)', borderRadius:4, padding:'8px 12px'}}>
            Gekoppeld aan <strong>{importedFileHandle.name}</strong> — elke opslag wordt hier automatisch in teruggeschreven.
            {' '}<button onClick={loskoppelenGeimporteerdBestand} style={{background:'none', border:'none', color:'var(--signal)', cursor:'pointer', fontWeight:600, padding:0, fontSize:13.5}}>Loskoppelen</button>
          </p>
        ) : ondersteuntBestandsToegang && (
          <p style={{fontSize:12.5, color:'var(--muted-light)'}}>
            Nog geen bestand gekoppeld — laad een bestand in om het automatisch te laten bijwerken.
          </p>
        )}
        <div style={{display:'flex', gap:10, marginTop:10, flexWrap:'wrap'}}>
          <Button onClick={exportJSON}>Exporteer data (.json)</Button>
          {ondersteuntBestandsToegang ? (
            <Button variant="ghost" onClick={importJSONMetHandle}>Importeer & koppel bestand</Button>
          ) : (
            <>
              <Button variant="ghost" onClick={()=>fileRef.current.click()}>Importeer data</Button>
              <input ref={fileRef} type="file" accept=".json" style={{display:'none'}}
                onChange={e=>{ if(e.target.files[0]) importJSONFile(e.target.files[0]); e.target.value=''; }} />
            </>
          )}
        </div>
      </Card>

      <Card style={{gridColumn:'1 / -1'}}>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Overzicht</h3>
        <div style={{display:'flex', gap:24, flexWrap:'wrap', fontSize:14, marginBottom:16}}>
          <div><strong>{state.posities.length}</strong> posities</div>
          <div><strong>{state.werknemers.length}</strong> werknemers</div>
          <div><strong>{totaalIndelingen}</strong> indelingen</div>
        </div>
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <Pill tone="ok">{ingecheckt} ingecheckt</Pill>
          <Pill tone="signal">{Math.max(nogTeGaan,0)} nog niet ingecheckt</Pill>
          <Pill>{uitgecheckt} uitgecheckt</Pill>
          {noShow > 0 && <Pill tone="warn">{noShow} no-show</Pill>}
        </div>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
