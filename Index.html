  // anders wordt eerst een nieuwe werknemer aangemaakt (bv. iemand die nog niet in de
  // werknemerslijst stond) en zodra die in de state staat alsnog gekoppeld en ingecheckt.
  const handleAdHocSubmit = (positieId, naam, nieuwePas, organisatie) => {
    const naamTrim = naam.trim();
    if(!naamTrim) return 'Vul een naam in.';
    const bestaande = state.werknemers.find(w => naamGelijk(w.naam, naamTrim));
    // forceerExtra: elke koppeling via de balie (bestaand of nieuw) wordt als extra toegevoegd
    // aan de gekozen positie — ook als die al bezet is en geen plakdienst is.
    if(bestaande) return koppelEnInchecken(positieId, bestaande.id, true);

    const error = addWerknemer(naamTrim, nieuwePas, organisatie || '');
    if(error) return error;
    setAdHocOpen(false);
    setAdHocNieuweWerknemer({naam: naamTrim, positieId});
    return null;
  };

  useEffect(() => {
    if(!adHocNieuweWerknemer) return;
    const werknemer = state.werknemers.find(w => naamGelijk(w.naam, adHocNieuweWerknemer.naam));
    if(werknemer){
      // forceerExtra: een gloednieuwe werknemer die aan de balie wordt aangemaakt, wordt altijd
      // als extra aan de gekozen positie gekoppeld — ook als die al bezet is en geen plakdienst is.
      koppelEnInchecken(adHocNieuweWerknemer.positieId, werknemer.id, true);
      setAdHocNieuweWerknemer(null);
    }
    // eslint-disable-next-line
  }, [state.werknemers]);

  useEffect(() => {
    if(!adHocPending) return;
    const ind = state.indelingen.find(i => i.positieId===adHocPending.positieId && i.werknemerId===adHocPending.werknemerId);
    if(ind){
      const werknemer = werknemerById[ind.werknemerId];
      openInchecken({werknemer, items: [{indeling: ind, positie: positieById[ind.positieId], checkin: checkinByIndelingId[ind.id]}]});
      setAdHocPending(null);
    }
    // eslint-disable-next-line
  }, [state.indelingen]);

  const bevestigInchecken = (materiaal, inTijd) => {
    const snapshot = checkIn(materiaalModal.indeling.id, materiaal, inTijd);
    setMateriaalModal(null);
    speelCheckFeedback();
    if(snapshot) setPrintData(snapshot);
  };
  const bevestigUitchecken = (materiaal, opmerking, uitTijd) => {
    checkOut(materiaalModal.indeling.id, materiaal, opmerking, uitTijd);
    setMateriaalModal(null);
    speelCheckFeedback();
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, marginBottom:20}}>
        <div style={{display:'flex', gap:4, background:'var(--nav-bg)', borderRadius:6, padding:4, width:'fit-content'}}>
          <button onClick={()=>setSubTab('balie')} style={{
            padding:'7px 16px', borderRadius:4, border:'none', cursor:'pointer', fontWeight:600, fontSize:13.5,
            background: subTab==='balie' ? 'var(--moss)' : 'transparent', color: subTab==='balie' ? '#fff' : 'var(--moss-dark)',
          }}>Inchecken / afmelden</button>
          <button onClick={()=>setSubTab('materiaal')} style={{
            padding:'7px 16px', borderRadius:4, border:'none', cursor:'pointer', fontWeight:600, fontSize:13.5,
            background: subTab==='materiaal' ? 'var(--moss)' : 'transparent', color: subTab==='materiaal' ? '#fff' : 'var(--moss-dark)',
          }}>Openstaand materiaal {totaalOpenItems > 0 ? `(${totaalOpenItems})` : ''}</button>
        </div>
        <div style={{display:'flex', gap:8, flexWrap:'wrap', alignItems:'center'}}>
          <Button variant="ghost" onClick={()=>{ setAdHocPrefillNaam(''); setAdHocOpen(true); }} style={{padding:'6px 14px', fontSize:13}}>+ Werknemer toevoegen</Button>
          <button onClick={()=>setStatusFilter(statusFilter==='ingecheckt' ? 'alle' : 'ingecheckt')} style={{border:'none', background:'none', padding:0, cursor:'pointer'}}>
            <Pill tone="ok">{ingecheckt} ingecheckt{statusFilter==='ingecheckt' ? ' (filter)' : ''}</Pill>
          </button>
          <button onClick={()=>setStatusFilter(statusFilter==='gepland' ? 'alle' : 'gepland')} style={{border:'none', background:'none', padding:0, cursor:'pointer'}}>
            <Pill tone="signal">{nogTeGaan} nog niet ingecheckt{statusFilter==='gepland' ? ' (filter)' : ''}</Pill>
          </button>
          <button onClick={()=>setStatusFilter(statusFilter==='uitgecheckt' ? 'alle' : 'uitgecheckt')} style={{border:'none', background:'none', padding:0, cursor:'pointer'}}>
            <Pill>{uitgecheckt} uitgecheckt{statusFilter==='uitgecheckt' ? ' (filter)' : ''}</Pill>
          </button>
        </div>
      </div>

      {subTab === 'materiaal' ? (
        <div style={{display:'grid', gap:10}}>
          {openstaandMateriaal.length===0 && (
            <Card style={{textAlign:'center', color:'var(--muted-light)'}}>Niemand heeft op dit moment nog openstaand materiaal.</Card>
          )}
          {openstaandMateriaal.map(row => (
            <Card key={row.indeling.id}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, flexWrap:'wrap', marginBottom:10}}>
                <div>
                  <div style={{fontFamily:'var(--display)', fontSize:17, fontWeight:600}}>{row.werknemer.naam}</div>
                  <div style={{fontSize:13, color:'var(--muted)', marginTop:2}}>
                    {row.positie?.naam || '—'} {row.positie?.sectie ? `· ${row.positie.sectie}` : ''} · sinds {row.checkin?.inTijd}
                    {row.checkin?.status === 'uitgecheckt' && <> · al uitgecheckt om {row.checkin.uitTijd}</>}
                  </div>
                </div>
              </div>
              <div style={{display:'grid', gap:6}}>
                {row.openItems.map(m => (
                  <div key={m.idx} style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:'var(--warn-bg)', borderRadius:4, padding:'8px 12px'}}>
                    <span style={{fontSize:14}}>{m.aantal}x {m.naam}</span>
                    <Button variant="ghost" style={{padding:'4px 12px', fontSize:12.5}}
                      onClick={()=>setMateriaalItemIngeleverd(row.indeling.id, m.idx, true)}>Markeer als ingeleverd</Button>
                  </div>
                ))}
              </div>
            </Card>
          ))}
        </div>
      ) : (
      <>
      <div style={{marginBottom:20, display:'flex', gap:14, alignItems:'center', flexWrap:'wrap'}}>
        <input autoFocus value={query} onChange={e=>setQuery(e.target.value)}
          placeholder="Zoek werknemer op naam of organisatie…"
          style={{...inputStyle, fontSize:20, padding:'16px 18px', fontFamily:'var(--display)', flex:1, minWidth:240}} />
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{...inputStyle, width:220}}>
          <option value="alle">Alle statussen ({alleRows.length})</option>
          <option value="gepland">Nog niet ingecheckt ({nogTeGaan})</option>
          <option value="ingecheckt">Ingecheckt ({ingecheckt})</option>
          <option value="uitgecheckt">Uitgecheckt ({uitgecheckt})</option>
          <option value="no-show">No-show ({noShow})</option>
        </select>
        <label style={{display:'flex', alignItems:'center', gap:8, cursor:'pointer', fontSize:13.5, color:'var(--moss-dark)', fontWeight:600, whiteSpace:'nowrap'}}>
          <input type="checkbox" checked={printerActief} onChange={e=>setPrinterActief(e.target.checked)} style={{width:16, height:16, accentColor:'var(--moss)'}} />
          Bonprinter actief
        </label>
      </div>

      {statusFilter !== 'alle' && (
        <div style={{marginBottom:14, fontSize:13, color:'var(--moss-dark)'}}>
          Filter actief: <strong>{({gepland:'nog niet ingecheckt', ingecheckt:'ingecheckt', uitgecheckt:'uitgecheckt', 'no-show':'no-show'})[statusFilter]}</strong>
          {' · '}<button onClick={()=>setStatusFilter('alle')} style={{background:'none', border:'none', color:'var(--signal)', cursor:'pointer', fontWeight:600, padding:0}}>wis filter</button>
        </div>
      )}

      {rows.length===0 && (
        <Card style={{textAlign:'center', color:'var(--muted-light)'}}>
          {state.indelingen.length===0 ? (
            <div>Nog geen indeling ingevoerd. Ga naar de tab Indeling om werknemers aan posities te koppelen.</div>
          ) : statusFilter !== 'alle' ? (
            <div>Geen resultaten voor deze status en zoekterm.</div>
          ) : query.trim() && nietGekoppeldeZoekMatches.length > 0 ? (
            <div style={{display:'grid', gap:12}}>
              <div>Geen resultaten, maar wel gevonden in de werknemerslijst — nog niet ingedeeld:</div>
              <div style={{display:'grid', gap:10}}>
                {nietGekoppeldeZoekMatches.map(w => (
                  <div key={w.id} style={{display:'flex', alignItems:'center', justifyContent:'center', gap:12}}>
                    <span style={{fontWeight:600, color:'var(--ink)'}}>{w.naam}</span>
                    <Button variant="signal" onClick={()=>{ setAdHocPrefillNaam(w.naam); setAdHocOpen(true); }}>Direct indelen</Button>
                  </div>
                ))}
              </div>
            </div>
          ) : query.trim() ? (
            <div style={{display:'grid', gap:12, justifyItems:'center'}}>
              <div>Geen resultaten voor "{query.trim()}".</div>
              <Button variant="signal" onClick={()=>{ setAdHocPrefillNaam(query.trim()); setAdHocOpen(true); }}>+ "{query.trim()}" aanmaken</Button>
            </div>
          ) : (
            <div>Geen resultaten bij deze zoekterm.</div>
          )}
        </Card>
      )}

      <div style={{display:'grid', gap:10}}>
        {rows.map((row) => {
          const {werknemer, items, status, teLaat} = row;
          const primaryId = items[0].indeling.id;
          const primaryCheckin = items[0].checkin;
          const heeftLeiding = items.some(it => it.positie?.leidinggevende);
          return (
            <Card key={row.werknemerId} style={{
              display:'flex', alignItems:'center', justifyContent:'space-between', gap:16, flexWrap:'wrap',
              ...(teLaat ? {borderColor:'var(--warn)', borderWidth:2, background:'var(--warn-bg)'} : {})
            }}>
              <div>
                <div style={{fontFamily:'var(--display)', fontSize:19, fontWeight:600}}>
                  {werknemer.naam} {heeftLeiding && <Pill tone="signal">Leidinggevende</Pill>}
                </div>
                {items.map((it, i) => (
                  <div key={it.indeling.id} style={{fontSize:13.5, color:'var(--muted)', marginTop:3}}>
                    {it.positie?.naam || '—'} {it.positie?.sectie ? `· ${it.positie.sectie}` : ''}
                    {it.positie?.ingang ? ` › ${it.positie.ingang}` : ''}
                    {(it.positie?.startTijd || it.positie?.eindTijd) ? ` · gepland ${it.positie?.startTijd || '?'}–${it.positie?.eindTijd || '?'}` : ''}
                  </div>
                ))}
              </div>
              <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
                {teLaat && <Pill tone="warn">Te laat</Pill>}
                <Pill tone={statusTone(status)}>
                  {statusLabel(status)}
                  {status==='ingecheckt' && primaryCheckin?.inTijd ? ` ${primaryCheckin.inTijd}` : ''}
                  {status==='uitgecheckt' && primaryCheckin?.uitTijd ? ` ${primaryCheckin.uitTijd}` : ''}
                </Pill>
                {primaryCheckin?.opmerking && <Pill tone="signal" title={primaryCheckin.opmerking}>Opmerking</Pill>}
                {status==='gepland' && <>
                  <Button variant="signal" onClick={()=>openInchecken(row)} style={{padding:'16px 28px', fontSize:16}}>Inchecken</Button>
                  <Button variant="ghost" onClick={()=>markNoShow(primaryId)} style={{padding:'14px 20px', fontSize:14.5}}>No-show</Button>
                </>}
                {status==='ingecheckt' && <>
                  <Button variant="primary" onClick={()=>openUitchecken(row)} style={{padding:'16px 28px', fontSize:16}}>Afmelden</Button>
                  <Button variant="ghost" onClick={()=>openInchecken(row)} style={{padding:'14px 20px', fontSize:14.5}}>Aanpassen</Button>
                </>}
                {(status==='uitgecheckt' || status==='no-show') && (
                  <Button variant="ghost" onClick={()=>resetCheckin(primaryId)} style={{padding:'14px 20px', fontSize:14.5}}>Terugzetten</Button>
                )}
              </div>
            </Card>
          );
        })}
      </div>
      </>
      )}

      {materiaalModal && (
        <MateriaalKeuzeModal
          mode={materiaalModal.mode}
          werknemer={materiaalModal.werknemer}
          positie={materiaalModal.positie}
          startMateriaal={materiaalModal.startMateriaal}
          startOpmerking={materiaalModal.startOpmerking}
          startUitTijd={materiaalModal.startUitTijd}
          startInTijd={materiaalModal.startInTijd}
          materiaalOpties={state.instellingen.materiaalOpties || DEFAULT_MATERIAAL_OPTIES}
          onConfirm={materiaalModal.mode==='in' ? bevestigInchecken : bevestigUitchecken}
          onCancel={()=>setMateriaalModal(null)}
        />
      )}

      {adHocOpen && (
        <AdHocKoppelModal
          posities={state.posities}
          werknemers={state.werknemers}
          werknemerNamen={werknemerNamen}
          initieleNaam={adHocPrefillNaam}
          onConfirm={handleAdHocSubmit}
          onCancel={()=>setAdHocOpen(false)}
        />
      )}
    </div>
  );
}

// ---------- Werknemer toevoegen die (nog) niet was ingedeeld, of nog niet in de lijst stond ----------
function AdHocKoppelModal({posities, werknemers, werknemerNamen, initieleNaam, onConfirm, onCancel}){
  const gesorteerdePosities = useMemo(() => [...posities].sort((a,b)=>(a.sectie||'').localeCompare(b.sectie||'') || a.naam.localeCompare(b.naam)), [posities]);
  const [positieId, setPositieId] = useState(gesorteerdePosities[0]?.id || '');
  const [naam, setNaam] = useState(initieleNaam || '');
  const [nieuwePas, setNieuwePas] = useState(false);
  const [organisatie, setOrganisatie] = useState('');
  const [fout, setFout] = useState(null);

  const bestaatAl = useMemo(
    () => werknemers.some(w => naamGelijk(w.naam, naam)),
    [werknemers, naam]
  );
  const isNieuw = naam.trim().length > 0 && !bestaatAl;

  const bevestig = () => {
    if(!positieId){ setFout('Kies eerst een positie.'); return; }
    if(!naam.trim()){ setFout('Vul een naam in.'); return; }
    const error = onConfirm(positieId, naam, nieuwePas, organisatie.trim());
    if(error) setFout(error);
  };

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,28,45,0.55)', display:'flex',
      alignItems:'center', justifyContent:'center', zIndex:60, padding:20
    }}>
      <Card style={{maxWidth:420, width:'100%'}}>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Werknemer toevoegen</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>
          Koppel een werknemer direct aan een positie en check ze meteen in — ook als ze nog niet was ingedeeld,
          of nog helemaal niet in de werknemerslijst stond. De koppeling wordt altijd als extra toegevoegd aan de
          gekozen positie, ook als die al bezet is en geen plakdienst is.
        </p>
        <Field label="Positie">
          <select style={inputStyle} value={positieId} onChange={e=>{ setPositieId(e.target.value); setFout(null); }}>
            {gesorteerdePosities.length===0 && <option value="">Geen posities beschikbaar</option>}
            {gesorteerdePosities.map(p => (
              <option key={p.id} value={p.id}>{p.naam}{p.sectie ? ` — ${p.sectie}` : ''}</option>
            ))}
          </select>
        </Field>
        <Field label="Werknemer">
          <WerknemerVeld
            tekst={naam}
            setTekst={(t)=>{ setNaam(t); setFout(null); }}
            alleNamen={werknemerNamen}
            opNaamKoppelen={(gekozenNaam)=>setNaam(gekozenNaam)}
            opTekstKoppelen={()=>{}}
            opBlurKoppelen={()=>{}}
            style={{width:'100%'}}
          />
        </Field>
        {isNieuw && (
          <div style={{fontSize:12.5, background:'var(--paper)', borderRadius:4, padding:'8px 12px', marginBottom:14}}>
            <div style={{color:'var(--moss-dark)', marginBottom:6}}>
              "{naam.trim()}" staat nog niet in de werknemerslijst en wordt automatisch toegevoegd.
            </div>
            <Field label="Organisatie (optioneel)">
              <input style={inputStyle} value={organisatie} onChange={e=>setOrganisatie(e.target.value)} placeholder="bv. extern uitzendbureau" />
            </Field>
            <Checkbox checked={nieuwePas} onChange={setNieuwePas} label="Beschikt over een beveiligingspas" />
          </div>
        )}
        {fout && <div style={{fontSize:13, color:'var(--warn)', marginBottom:10}}>{fout}</div>}
        <div style={{display:'flex', gap:10, justifyContent:'flex-end', marginTop:10}}>
          <Button variant="ghost" onClick={onCancel}>Annuleer</Button>
          <Button variant="signal" onClick={bevestig}>Koppelen & inchecken</Button>
        </div>
      </Card>
    </div>
  );
}

// ---------- Materiaalkeuze modal (bij in-/uitchecken) ----------
function MateriaalKeuzeModal({mode, werknemer, positie, startMateriaal, materiaalOpties, startOpmerking, startUitTijd, startInTijd, onConfirm, onCancel}){
  // Bij inchecken: vrij bewerkbare lijst van mee te geven materiaal.
  const [materiaal, setMateriaal] = useState(() => (startMateriaal||[]).map(m=>({...m})));
  // Bij uitchecken: dezelfde lijst staat vast (wat is meegegeven blijft geregistreerd),
  // en je vinkt per item aan of het is ingeleverd. Standaard staat niets aangevinkt —
  // alleen items die al eerder als ingeleverd waren gemarkeerd starten aangevinkt.
  const [ingeleverd, setIngeleverd] = useState(() => {
    const set = new Set();
    (startMateriaal||[]).forEach((m,i) => { if(m.ingeleverd) set.add(i); });
    return set;
  });
  const [opmerking, setOpmerking] = useState(startOpmerking || '');
  const [uitTijd, setUitTijd] = useState(startUitTijd || nowTime());
  const [inTijd, setInTijd] = useState(startInTijd || nowTime());

  const isGeselecteerd = (naam) => materiaal.some(m=>m.naam.toLowerCase()===naam.toLowerCase());
  const toggleOptie = (naam) => {
    if(mode !== 'in') return; // snelkeuze alleen relevant bij inchecken
    if(isGeselecteerd(naam)){
      setMateriaal(materiaal.filter(m=>m.naam.toLowerCase()!==naam.toLowerCase()));
    } else {
      setMateriaal([...materiaal, {naam, aantal:1}]);
    }
  };
  const updateAantal = (idx, aantal) => {
    const copy = [...materiaal];
    copy[idx] = {...copy[idx], aantal: Number(aantal)||1};
    setMateriaal(copy);
  };
  const removeRegel = (idx) => setMateriaal(materiaal.filter((_,i)=>i!==idx));
  const toggleIngeleverd = (idx) => {
    const copy = new Set(ingeleverd);
    if(copy.has(idx)) copy.delete(idx); else copy.add(idx);
    setIngeleverd(copy);
  };

  const [nieuwNaam, setNieuwNaam] = useState('');
  const [nieuwAantal, setNieuwAantal] = useState(1);
  const addCustom = () => {
    if(!nieuwNaam.trim()) return;
    setMateriaal([...materiaal, {naam:nieuwNaam.trim(), aantal:Number(nieuwAantal)||1}]);
    setNieuwNaam(''); setNieuwAantal(1);
  };

  const handleConfirm = () => {
    if(mode==='in') onConfirm(materiaal, inTijd);
    else {
      const ingeleverdNamen = new Set(materiaal.filter((_,i) => ingeleverd.has(i)).map(m=>m.naam.toLowerCase()));
      onConfirm(ingeleverdNamen, opmerking, uitTijd);
    }
  };

  // Toetsenbord-snelkeuze: cijfertoetsen 1-9 vinken direct de bijbehorende materiaaloptie aan/uit (alleen bij inchecken).
  // Werkt niet als de gebruiker op dat moment in een tekst- of getalveld typt.
  useEffect(() => {
    const handler = (e) => {
      const tag = document.activeElement?.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA') return;
      const num = Number(e.key);
      if(mode==='in' && num >= 1 && num <= materiaalOpties.length){
        e.preventDefault();
        toggleOptie(materiaalOpties[num-1]);
      } else if(e.key === 'Enter'){
        e.preventDefault();
        handleConfirm();
      } else if(e.key === 'Escape'){
        e.preventDefault();
        onCancel();
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [materiaal, opmerking, uitTijd, inTijd, ingeleverd]);

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,28,45,0.55)', display:'flex',
      alignItems:'center', justifyContent:'center', zIndex:60, padding:20
    }}>
      <div style={{background:'var(--card)', borderRadius:6, padding:24, maxWidth:440, width:'100%', maxHeight:'88vh', overflowY:'auto'}}>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>
          {mode==='in' ? 'Materiaal bij inchecken' : 'Materiaal inleveren bij afmelden'}
        </h3>
        <div style={{fontSize:13.5, color:'var(--muted)', marginBottom:4}}>
          {werknemer.naam} · {positie?.naam}{positie?.sectie ? ` · ${positie.sectie}` : ''}
        </div>
        <div style={{fontSize:13.5, color:'var(--muted)', marginBottom:16}}>
          Portofoon: {positie?.vereistPortofoon ? 'V' : 'X'}
        </div>

        {mode==='in' && (
          <Field label="Inchecktijd (standaard nu)">
            <input type="time" style={inputStyle} value={inTijd} onChange={e=>setInTijd(e.target.value)} />
          </Field>
        )}

        {positie?.materiaal?.length > 0 && mode==='in' && (
          <div style={{fontSize:12.5, color:'var(--moss-dark)', background:'var(--paper)', borderRadius:4, padding:'8px 12px', marginBottom:14}}>
            Standaard bij deze positie: {positie.materiaal.map(m=>`${m.aantal}x ${m.naam}`).join(', ')}
          </div>
        )}

        {mode==='in' && (
          <>
            <div style={{fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'.05em', color:'var(--moss-dark)', marginBottom:8}}>
              Snelkeuze <span style={{fontWeight:400, textTransform:'none', letterSpacing:'normal'}}>(of druk op het cijfer)</span>
            </div>
            <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:16}}>
              {materiaalOpties.map((optie, i) => (
                <button key={optie} onClick={()=>toggleOptie(optie)} style={{
                  padding:'8px 14px', borderRadius:4, cursor:'pointer', fontSize:13.5, fontWeight:600,
                  border: isGeselecteerd(optie) ? '1px solid var(--moss)' : '1px solid var(--line)',
                  background: isGeselecteerd(optie) ? 'var(--moss)' : 'var(--card)',
                  color: isGeselecteerd(optie) ? '#fff' : 'var(--ink)',
                }}>{i+1}. {optie}</button>
              ))}
            </div>

            <div style={{fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'.05em', color:'var(--moss-dark)', marginBottom:8}}>
              Mee te geven materiaal
            </div>
            <div style={{display:'grid', gap:6, marginBottom:10}}>
              {materiaal.length===0 && <div style={{fontSize:13, color:'var(--muted-light)'}}>Geen materiaal geselecteerd.</div>}
              {materiaal.map((m,i) => (
                <div key={i} style={{display:'flex', alignItems:'center', gap:8}}>
                  <input type="number" min="1" style={{...inputStyle, width:60}} value={m.aantal} onChange={e=>updateAantal(i, e.target.value)} />
                  <div style={{flex:1, fontSize:14}}>{m.naam}</div>
                  <button onClick={()=>removeRegel(i)} style={{background:'none', border:'none', color:'var(--warn)', cursor:'pointer', fontSize:13}}>verwijderen</button>
                </div>
              ))}
            </div>

            <div style={{display:'flex', gap:8, marginBottom:18}}>
              <input style={{...inputStyle, width:64}} type="number" min="1" value={nieuwAantal} onChange={e=>setNieuwAantal(e.target.value)} />
              <input style={inputStyle} placeholder="ander materiaal toevoegen…" value={nieuwNaam} onChange={e=>setNieuwNaam(e.target.value)} />
              <Button variant="ghost" onClick={addCustom}>+</Button>
            </div>
          </>
        )}

        {mode==='uit' && (
          <>
            <div style={{fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'.05em', color:'var(--moss-dark)', marginBottom:8}}>
              Meegegeven materiaal — vink af wat is ingeleverd
            </div>
            <div style={{display:'grid', gap:6, marginBottom:18}}>
              {materiaal.length===0 && <div style={{fontSize:13, color:'var(--muted-light)'}}>Er was geen materiaal meegegeven.</div>}
              {materiaal.map((m,i) => (
                <label key={i} style={{display:'flex', alignItems:'center', gap:10, cursor:'pointer', background:'var(--soft-bg)', borderRadius:4, padding:'8px 12px'}}>
                  <input type="checkbox" checked={ingeleverd.has(i)} onChange={()=>toggleIngeleverd(i)} style={{width:16, height:16, accentColor:'var(--moss)'}} />
                  <span style={{fontSize:14, flex:1}}>{m.aantal}x {m.naam}</span>
                  {!ingeleverd.has(i) && <Pill tone="warn">niet ingeleverd</Pill>}
                </label>
              ))}
            </div>

            <Field label="Uitchecktijd (standaard nu, eerder uitchecken kan)">
              <input type="time" style={inputStyle} value={uitTijd} onChange={e=>setUitTijd(e.target.value)} />
            </Field>
            <Field label="Opmerking (optioneel)">
              <textarea style={{...inputStyle, minHeight:64, resize:'vertical', fontFamily:'var(--body)'}}
                value={opmerking} onChange={e=>setOpmerking(e.target.value)} placeholder="Bijzonderheden bij het afmelden…" />
            </Field>
          </>
        )}

        <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
          <Button variant="ghost" onClick={onCancel}>Annuleer</Button>
          <Button variant={mode==='in' ? 'signal' : 'primary'} onClick={handleConfirm}>
            {mode==='in' ? 'Inchecken' : 'Afmelden bevestigen'}
          </Button>
        </div>
      </div>
    </div>
  );
}

// ---------- Bonnetje (print) ----------
function Bonnetje({data, autoPrint, onClose, instellingen}){
  const accent = instellingen?.bonAccentkleur || '#303F62';
  const voettekst = instellingen?.bonVoettekst || 'Bedankt voor je inzet!';
  const lettergrootte = instellingen?.bonLettergrootte || 11;
  const bonRef = useRef(null);
  // De papierlengte van bonprinters wordt hier exact op de werkelijke inhoud afgestemd (in plaats
  // van een vast/gegokt papierformaat). Een te kort formaat laat de printer halverwege afsnijden;
  // een te lang/vast formaat laat sommige bonprinter-drivers juist raar herhalen of corrumperen.
  const [paginaHoogteMM, setPaginaHoogteMM] = useState(297);
  useLayoutEffect(() => {
    if(!bonRef.current) return;
    const hoogtePx = bonRef.current.getBoundingClientRect().height;
    const hoogteMM = Math.ceil(hoogtePx / 96 * 25.4) + 15; // marge voor afronding/randen
    setPaginaHoogteMM(hoogteMM);
  }, [data, lettergrootte]);
  useEffect(() => {
    if(!autoPrint) return;
    const t = setTimeout(() => window.print(), 150);
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    const handler = () => onClose();
    window.addEventListener('afterprint', handler);
    return () => window.removeEventListener('afterprint', handler);
  }, []);
  return (
    <div id="bonnetje-overlay" style={{
      position:'fixed', inset:0, background:'rgba(20,27,43,0.55)', display:'flex',
      alignItems:'center', justifyContent:'center', zIndex:50
    }}>
      <style>{`@media print { @page { size: 76mm ${paginaHoogteMM}mm; margin: 0; } }`}</style>
      <div id="bonnetje-card" style={{background:'var(--card)', borderRadius:6, padding:24, maxWidth:360, width:'92%'}}>
        <div id="bonnetje" ref={bonRef} style={{fontFamily:'var(--mono)', fontSize:lettergrootte, lineHeight:1.5, color:'#000', padding:12}}>
          <div><strong>{data.werknemer.naam}</strong></div>
          <div>Ingecheckt: {data.inTijd}</div>
          <div style={{borderTop:'1px dashed #000', margin:'8px 0'}}></div>
          <div><strong>Positie:</strong> {data.positie.naam}</div>
          {data.positie.sectie && <div><strong>Sectie:</strong> {data.positie.sectie}</div>}
          {data.positie.ingang && <div><strong>Ingang:</strong> {data.positie.ingang}</div>}
          {data.leidinggevendeNaam && <div><strong>Leidinggevende:</strong> {data.leidinggevendeNaam}</div>}
          <div style={{borderTop:'1px dashed #000', margin:'8px 0'}}></div>
          {data.positie.uniform && data.positie.uniform.length>0 && (
            <>
              <div style={{fontWeight:700, marginBottom:4}}>Uniform:</div>
              <div>{data.positie.uniform.join(', ')}</div>
              <div style={{borderTop:'1px dashed #000', margin:'8px 0'}}></div>
            </>
          )}
          <div style={{fontWeight:700, marginBottom:4}}>Materiaal mee:</div>
          {data.materiaal.length===0 && <div>— geen —</div>}
          {data.materiaal.map((m,i) => <div key={i}>{m.aantal}x {m.naam}</div>)}
          <div style={{borderTop:'1px dashed #000', margin:'8px 0'}}></div>
          <div style={{textAlign:'center', fontSize:lettergrootte}}>{voettekst}</div>
          <div style={{height:'10mm'}}></div>
          <div style={{borderTop:'1px dashed #000', margin:'8px 0'}}></div>
          <div style={{textAlign:'center', fontWeight:700, fontSize:lettergrootte+3, marginBottom:4, color:accent}}>{data.event.name}</div>
          <div style={{textAlign:'center', marginBottom:'11mm'}}>{data.event.date}</div>
        </div>
        {!autoPrint && (
          <div className="no-print" style={{fontSize:12, color:'var(--muted-light)', marginTop:10}}>Bonprinter staat uit — er wordt niet automatisch geprint.</div>
        )}
        <div className="no-print" style={{display:'flex', gap:10, marginTop:18, justifyContent:'flex-end'}}>
          <Button variant="ghost" onClick={onClose}>Sluiten</Button>
          <Button variant="primary" onClick={()=>window.print()}>{autoPrint ? 'Print opnieuw' : 'Print bon'}</Button>
        </div>
      </div>
    </div>
  );
}

// ---------- Posities tab ----------
function PositiesTab({posities, addPositie, updatePositie, removePositie, duplicatePositie, addMateriaalRegel, removeMateriaalRegel, importPosities}){
  const [naam, setNaam] = useState('');
  const [sectie, setSectie] = useState('');
  const [ingang, setIngang] = useState('');
  const [uniform, setUniform] = useState([]);
  const [portofoon, setPortofoon] = useState(false);
  const [plakdienst, setPlakdienst] = useState(false);
  const [leidinggevende, setLeidinggevende] = useState(false);
  const [startTijd, setStartTijd] = useState('');
  const [eindTijd, setEindTijd] = useState('');
  const [editId, setEditId] = useState(null);
  const [sortBy, setSortBy] = useState('sectie'); // 'sectie' | 'naam'
  const [query, setQuery] = useState('');
  const fileRef = useRef(null);

  // Bestaande ingang-namen, als suggesties bij het invoeren — zodat "Ingang 2" niet per ongeluk
  // als "ingang2" of "Ingang  2" wordt getypt, waardoor de groepering in de exports uit elkaar valt.
  const ingangSuggesties = useMemo(() => {
    const set = new Set();
    posities.forEach(p => { if(p.ingang) set.add(p.ingang); });
    return [...set].sort((a,b)=>a.localeCompare(b));
  }, [posities]);

  const toggleUniform = (val, list, setList) => {
    setList(list.includes(val) ? list.filter(u=>u!==val) : [...list, val]);
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    leesCSVBestand(file, (tekst) => {
      importPosities(parseCSV(tekst));
    });
    e.target.value = '';
  };

  // Overzicht aantal posities per sectie, voor controle tegen verwachte inzet
  const sectieOverzicht = useMemo(() => {
    const m = {};
    posities.forEach(p => {
      const key = p.sectie || '(geen sectie)';
      m[key] = (m[key]||0) + 1;
    });
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  }, [posities]);

  // Overzicht aantal posities dat een portofoon vereist, per sectie (voor de portofoon-uitgifte)
  const portofoonOverzicht = useMemo(() => {
    const m = {};
    posities.filter(p => p.vereistPortofoon).forEach(p => {
      const key = p.sectie || '(geen sectie)';
      m[key] = (m[key]||0) + 1;
    });
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  }, [posities]);
  const totaalPortofoons = useMemo(() => posities.filter(p => p.vereistPortofoon).length, [posities]);

  const gefilterdGesorteerd = useMemo(() => {
    let list = [...posities];
    if(query){
      const q = query.toLowerCase();
      list = list.filter(p => p.naam.toLowerCase().includes(q) || (p.sectie||'').toLowerCase().includes(q) || (p.ingang||'').toLowerCase().includes(q));
    }
    if(sortBy==='sectie') list.sort((a,b) => (a.sectie||'').localeCompare(b.sectie||'') || (a.ingang||'').localeCompare(b.ingang||'') || a.naam.localeCompare(b.naam));
    if(sortBy==='naam') list.sort((a,b) => a.naam.localeCompare(b.naam));
    return list;
  }, [posities, sortBy, query]);

  return (
    <div className="two-col-layout" style={{display:'grid', gridTemplateColumns:'340px 1fr', gap:24, alignItems:'start'}}>
      <div style={{display:'grid', gap:16}}>
        <Card>
          <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Nieuwe positie</h3>
          <Field label="Naam"><input style={inputStyle} value={naam} onChange={e=>setNaam(e.target.value)} placeholder="bv. Steward" /></Field>
          <Field label="Sector"><input style={inputStyle} value={sectie} onChange={e=>setSectie(e.target.value)} placeholder="bv. B-Side" /></Field>
          <Field label="Ingang (optioneel)">
            <input style={inputStyle} value={ingang} onChange={e=>setIngang(e.target.value)} placeholder="bv. Ingang 2 — leeg = rechtstreeks in de sector" list="ingang-suggesties" />
          </Field>
          <Field label="Starttijd">
            <input type="time" style={{...inputStyle, width:'auto'}} value={startTijd} onChange={e=>setStartTijd(e.target.value)}
              title="Gebruikt voor de 'te laat'-indicator op de Balie" />
          </Field>
          <Field label="Eindtijd">
            <input type="time" style={{...inputStyle, width:'auto'}} value={eindTijd} onChange={e=>setEindTijd(e.target.value)}
              title="Gebruikt als standaard uitchecktijd bij het afmelden" />
          </Field>
          <Field label="Uniform">
            <div style={{display:'grid', gap:6}}>
              {UNIFORM_OPTIES.map(u => (
                <Checkbox key={u} checked={uniform.includes(u)} onChange={()=>toggleUniform(u, uniform, setUniform)} label={u} />
              ))}
            </div>
          </Field>
          <Field label="Aanvullende opties">
            <div style={{display:'grid', gap:6}}>
              <Checkbox checked={portofoon} onChange={setPortofoon} label="Portofoon benodigd" />
              <Checkbox checked={plakdienst} onChange={setPlakdienst} label="Dubbele dienst" />
              <Checkbox checked={leidinggevende} onChange={setLeidinggevende} label="Leidinggevende" />
            </div>
          </Field>
          <Button onClick={()=>{ if(naam.trim()){ addPositie(naam.trim(), sectie.trim(), ingang.trim(), uniform, portofoon, plakdienst, leidinggevende, startTijd, eindTijd); setNaam(''); setSectie(''); setIngang(''); setUniform([]); setPortofoon(false); setPlakdienst(false); setLeidinggevende(false); setStartTijd(''); setEindTijd(''); } }}>Toevoegen</Button>
        </Card>

        <datalist id="ingang-suggesties">
          {ingangSuggesties.map(i => <option key={i} value={i} />)}
        </datalist>

        <Card>
          <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Importeren via CSV</h3>
          <div style={{fontSize:12.5, color:'var(--muted)', marginBottom:8}}>
            Kolommen: <strong>naam, sectie, uniform</strong>.<br/>
            Uniform komma- of pipe-gescheiden, bv. "Steward,Hoofdsteward".<br/>
            Optioneel: <strong>ingang</strong> (groepeert posities binnen een sectie, bv. "Ingang 2" — leeg laten voor posities die rechtstreeks in de sector vallen), <strong>starttijd</strong> (HH:MM, voor de 'te laat'-indicator op de Balie), <strong>eindtijd</strong> (HH:MM, standaard uitchecktijd bij afmelden), <strong>portofoon</strong> (ja/nee), <strong>plakdienst</strong> (ja/nee), <strong>leidinggevende</strong> (ja/nee), <strong>materiaal</strong> als "portofoon:1|hesje:1".
          </div>
          <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
            <input ref={fileRef} type="file" accept=".csv" onChange={handleFile} />
            <Button variant="ghost" onClick={()=>downloadCSV('posities_sjabloon.csv', POSITIE_CSV_TEMPLATE)} style={{padding:'6px 12px', fontSize:12.5}}>Sjabloon</Button>
          </div>
          <div style={{fontSize:12.5, color:'var(--muted)', margin:'12px 0 8px'}}>
            Of exporteer de huidige posities om ze snel in bulk aan te passen (bv. in Excel) en daarna weer te importeren.
          </div>
          <Button variant="ghost" onClick={()=>downloadCSV('posities_export.csv', positiesNaarCSV(posities))} disabled={posities.length===0} style={{padding:'6px 12px', fontSize:12.5}}>
            Exporteer huidige posities (CSV)
          </Button>
        </Card>

        <Card>
          <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Posities per sectie</h3>
          <div style={{fontSize:12.5, color:'var(--muted)', marginBottom:10}}>Voor controle tegen de verwachte inzet vanuit de opdrachtgever.</div>
          <div style={{display:'grid', gap:4}}>
            {sectieOverzicht.map(([naamSectie, aantal]) => (
              <div key={naamSectie} style={{display:'flex', justifyContent:'space-between', fontSize:13.5, padding:'4px 0', borderBottom:'1px solid var(--line)'}}>
                <span>{naamSectie}</span>
                <strong>{aantal}</strong>
              </div>
            ))}
            {sectieOverzicht.length===0 && <div style={{color:'var(--muted-light)', fontSize:13}}>Nog geen posities.</div>}
          </div>
          <div style={{display:'flex', justifyContent:'space-between', fontSize:13.5, marginTop:8, paddingTop:8, borderTop:'1px solid var(--line)', fontWeight:700}}>
            <span>Totaal</span><span>{posities.length}</span>
          </div>
        </Card>

        <Card>
          <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Portofoons</h3>
          <div style={{fontSize:12.5, color:'var(--muted)', marginBottom:10}}>Aantal posities dat een portofoon vereist, per sectie.</div>
          <div style={{display:'grid', gap:4}}>
            {portofoonOverzicht.map(([naamSectie, aantal]) => (
              <div key={naamSectie} style={{display:'flex', justifyContent:'space-between', fontSize:13.5, padding:'4px 0', borderBottom:'1px solid var(--line)'}}>
                <span>{naamSectie}</span>
                <strong>{aantal}</strong>
              </div>
            ))}
            {portofoonOverzicht.length===0 && <div style={{color:'var(--muted-light)', fontSize:13}}>Geen posities met portofoon.</div>}
          </div>
          <div style={{display:'flex', justifyContent:'space-between', fontSize:13.5, marginTop:8, paddingTop:8, borderTop:'1px solid var(--line)', fontWeight:700}}>
