/* ---------- Donkere modus (voor avond/nacht-evenementen) ---------- */
body.dark-mode{
  color-scheme: dark;
  --ink:#E9ECF2;
  --paper:#141B2B;
  --moss:#3E5180;
  --moss-dark:#AAB4CC;
  --signal:#55A6EC;
  --signal-soft:#0B4B87;
  --line:#232E48;

  --warn:#E2777C;
  --card:#1A2338;
  --muted:#AAB4CC;
  --muted-light:#7E8DB4;

  --nav-bg:#1A2338;
  --warn-bg:#3A1D20;
  --warn-bg2:#3A2E18;

}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .15s ease, color .15s ease;}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-0.01em;color:var(--moss-dark);line-height:1.25;}

/* ---------- Responsief voor mobiel/tablet ---------- */
@media (max-width: 820px){
  .two-col-layout{ grid-template-columns: 1fr !important; }

}

  main{ padding: 12px !important; }
  .card{ padding: 14px !important; }
}

.phone-only{ display:none; }

// Rondt een tijdstip (HH:MM) af op een kwartier: minder dan drempelMinuten voorbij het kwartier
// rondt naar beneden af, drempelMinuten of meer rondt naar boven af (geen symmetrische afronding).
// Uitchecktijd gebruikt de standaarddrempel van 10 minuten; de inchecktijd bij een verstreken
// starttijd gebruikt een kortere drempel van 5 minuten (zie isStartTijdVerstreken hieronder).
const rondAfOpKwartier = (tijdStr, drempelMinuten = 10) => {
  if(!tijdStr) return tijdStr;
  const [uur, min] = tijdStr.split(':').map(Number);
  const totaalMin = uur * 60 + min;
  const rest = totaalMin % 15;
  const afgerond = ((rest < drempelMinuten ? totaalMin - rest : totaalMin + (15 - rest)) + 1440) % 1440;
  const uurAfgerond = Math.floor(afgerond / 60);
  const minAfgerond = afgerond % 60;
  return `${String(uurAfgerond).padStart(2,'0')}:${String(minAfgerond).padStart(2,'0')}`;
};

// Normaliseert een naam voor het vergelijken van werknemersnamen: hoofdletters negeren en
// overtollige spaties (dubbele spaties, spaties uit een CSV-cel) samenvoegen, zodat kleine
// tikfouten een koppeling niet laten mislukken.
const normaliseerNaam = (naam) => (naam || '').trim().replace(/\s+/g, ' ').toLowerCase();
const naamGelijk = (a, b) => normaliseerNaam(a) === normaliseerNaam(b);

// Kort geluidssignaal + trilling bij een geslaagde in-/uitcheck, zodat de balie-medewerker
// dit niet per se hoeft te zien tijdens een drukke instroom. Faalt stil als de browser
// AudioContext/vibrate niet ondersteunt (bv. desktop zonder gebruikersinteractie-gate).
const speelCheckFeedback = () => {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch(e) { /* geen audio beschikbaar, geen probleem */ }
  if(navigator.vibrate) navigator.vibrate(80);
};

// Bepaalt of een positie met deze starttijd (HH:MM) inmiddels te laat is: X minuten na
// die starttijd staat een indeling nog op 'gepland'. Vergelijkt op tijd-van-de-dag, wat
// past bij hoe de rest van de app tijden bijhoudt (nowTime() geeft ook alleen HH:MM).
const TE_LAAT_MINUTEN = 15;
const isTeLaat = (startTijd) => {
  if(!startTijd) return false;
  const [uur, min] = startTijd.split(':').map(Number);
  const nu = new Date();
  const geplandMin = uur * 60 + min;
  const nuMin = nu.getHours() * 60 + nu.getMinutes();
  return (nuMin - geplandMin) >= TE_LAAT_MINUTEN;
};

// Bepaalt of een geplande starttijd (HH:MM) al voorbij is op het huidige moment — gebruikt om bij
// het inchecken te kiezen tussen de vaste geplande starttijd (nog niet verstreken) en de actuele,
// afgeronde tijd (wel verstreken; zie rondAfOpKwartier bij openInchecken).
const isStartTijdVerstreken = (startTijd) => {
  if(!startTijd) return false;
  const [uur, min] = startTijd.split(':').map(Number);
  const nu = new Date();
  const geplandMin = uur * 60 + min;
  const nuMin = nu.getHours() * 60 + nu.getMinutes();
  return nuMin > geplandMin;
};

// ---------- CSV parsing (simple, comma or semicolon) ----------
// Leest een CSV-bestand met betrouwbare tekstcodering. Excel op Windows slaat "CSV (Comma
// delimited)" standaard op als Windows-1252 (ANSI), niet als UTF-8 — lees je zo'n bestand met
// readAsText (dat UTF-8 aanneemt), dan worden accenten (é, ë, ü, …) vervangen door het
// "gekke teken" U+FFFD en loopt de rest van de regel door elkaar. We proberen daarom eerst
// strikt UTF-8 (fatal:true gooit een fout bij een ongeldige byte i.p.v. tekens te vervangen)
// en vallen anders terug op Windows-1252.
function leesCSVBestand(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const buffer = e.target.result;
    let tekst;
    try { tekst = new TextDecoder('utf-8', {fatal:true}).decode(buffer); }
    catch(err){ tekst = new TextDecoder('windows-1252').decode(buffer); }
    callback(tekst);
  };
  reader.readAsArrayBuffer(file);
}

function parseCSV(text){
  const sep = text.split('\n')[0].includes(';') ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  const headers = lines[0].split(sep).map(h => h.trim().toLowerCase());
  return lines.slice(1).map(line => {
    const cells = line.split(sep).map(c => c.trim());
    const row = {};
    headers.forEach((h,i) => row[h] = cells[i] ?? '');
    return row;
  });
}

function downloadCSV(filename, content){
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// Zet de huidige posities om naar CSV in exact hetzelfde kolomformaat als POSITIE_CSV_TEMPLATE,
// zodat je ze kunt exporteren, in Excel/een teksteditor snel kunt aanpassen en weer kunt
// importeren. Let op: net als bij importeren wordt ';' als scheidingsteken gebruikt en is er
// geen quote-ondersteuning — een ';' in een naam zou de kolommen laten verschuiven.
function positiesNaarCSV(posities){
  const header = 'naam;sectie;ingang;starttijd;eindtijd;uniform;portofoon;plakdienst;leidinggevende;materiaal';
  const rijen = posities.map(p => [
    p.naam,
    p.sectie || '',
    p.ingang || '',
    p.startTijd || '',
    p.eindTijd || '',
    (p.uniform || []).join(','),
    p.vereistPortofoon ? 'ja' : 'nee',
    p.plakdienst ? 'ja' : 'nee',
    p.leidinggevende ? 'ja' : 'nee',
    (p.materiaal || []).map(m => `${m.naam}:${m.aantal}`).join('|'),
  ].join(';'));
  return [header, ...rijen].join('\n') + '\n';
}

    display:'inline-block', padding:'3px 10px', borderRadius:3,
    fontSize:12, fontWeight:600, letterSpacing:'.02em',
    background:t.bg, color:t.fg
  }}>{children}</span>;
}

function Button({children, onClick, variant='primary', disabled, style, type='button'}){
  const base = {
    fontFamily:'var(--body)', fontWeight:600, fontSize:14,
    padding:'10px 18px', borderRadius:4, border:'1px solid transparent',
    cursor: disabled ? 'not-allowed':'pointer', opacity: disabled?0.5:1,
    transition:'background-color .14s cubic-bezier(.4,0,.2,1), transform .14s cubic-bezier(.4,0,.2,1)',
  };
  const variants = {
    primary: {background:'var(--moss)', color:'#fff'},
    signal: {background:'var(--signal)', color:'#fff'},
    ghost: {background:'transparent', color:'var(--moss-dark)', border:'1px solid var(--navy-400, #7E8DB4)'},
    danger: {background:'transparent', color:'var(--warn)', border:'1px solid var(--warn)'},
  };
  return <button type={type} disabled={disabled} onClick={onClick}
    onMouseDown={e=>e.currentTarget.style.transform='scale(0.985)'}
    onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
    style={{...base, ...variants[variant], ...style}}>{children}</button>;
}

function Field({label, children}){
  return (
    <label style={{display:'block', marginBottom:14}}>
      <div style={{fontSize:12, fontWeight:600, color:'var(--moss-dark)', marginBottom:5, textTransform:'uppercase', letterSpacing:'.05em'}}>{label}</div>
      {children}
    </label>
  );
}

const inputStyle = {
  width:'100%', padding:'9px 12px', borderRadius:4, border:'1px solid var(--line)',
  fontSize:15, fontFamily:'var(--body)', background:'var(--card)', color:'var(--ink)'
};

function Card({children, style, onClick, ...rest}){
  return <div className="card" onClick={onClick} {...rest} style={{background:'var(--card)', border:'1px solid var(--line)', borderRadius:6, padding:20, ...style}}>{children}</div>;
}

function Checkbox({checked, onChange, label}){
  return (
    <label style={{display:'flex', alignItems:'center', gap:8, cursor:'pointer', fontSize:14}}>
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}
        style={{width:16, height:16, accentColor:'var(--moss)'}} />
      {label}
    </label>
  );
}

// ---------- Lock-scherm voor gevoelige tabbladen (Edit, Data) ----------
// Let op: dit is geen echte beveiliging, de code staat in de broncode van deze pagina.
// Het is een drempel tegen per ongeluk aanpassen, niet tegen iemand die het bestand zelf opent.
function LockedTab({children}){
  const [unlocked, setUnlocked] = useState(false);
  const [code, setCode] = useState('');
  const [fout, setFout] = useState(false);

  if(unlocked) return children;

  const handleSubmit = () => {
    if(code === LOCK_CODE){ setUnlocked(true); setFout(false); }
    else { setFout(true); }
  };

  return (
    <div style={{display:'flex', justifyContent:'center', paddingTop:60}}>
      <Card style={{maxWidth:320, width:'100%', textAlign:'center'}}>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Toegangscode vereist</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>Dit tabblad is vergrendeld om per ongeluk aanpassen te voorkomen.</p>
        <input
          type="password" inputMode="numeric" autoFocus
          style={{...inputStyle, textAlign:'center', fontSize:18, letterSpacing:'0.2em', marginBottom:10}}
          value={code} onChange={e=>{ setCode(e.target.value); setFout(false); }}
          onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); handleSubmit(); } }}
          placeholder="Code"
        />
        {fout && <div style={{fontSize:13, color:'var(--warn)', marginBottom:10}}>Onjuiste code.</div>}
        <Button onClick={handleSubmit}>Ontgrendelen</Button>
      </Card>
    </div>
  );
}

// ---------- Main App ----------
function App(){
  const [state, setState] = useState(emptyState);
  const [tab, setTab] = useState('balie');
  const [ingelogd, setIngelogd] = useState(false);
  const [started, setStarted] = useState(false);
  const [printData, setPrintData] = useState(null);
  const [printerActief, setPrinterActief] = useState(true);

  // Donkere modus voor avond/nacht-evenementen. Wordt als class op <body> gezet (niet op een
  // React-wrapper) zodat het ook geldt voor het Login- en Startscherm, die los van elkaar
  // renderen vóórdat het dashboard mount.
  const [donkereModus, setDonkereModus] = useState(false);
  useEffect(() => {
    document.body.classList.toggle('dark-mode', donkereModus);
  }, [donkereModus]);

  // ---- derived lookups ----
  const positieById = useMemo(() => Object.fromEntries(state.posities.map(p=>[p.id,p])), [state.posities]);
  const werknemerById = useMemo(() => Object.fromEntries(state.werknemers.map(v=>[v.id,v])), [state.werknemers]);

  const checkinByIndelingId = useMemo(() => {
    const m = {};
    state.checkins.forEach(c => { m[c.indelingId] = c; });
    return m;
  }, [state.checkins]);

  // ---- mutations ----
  // Elke mutatie zet eerst de huidige (nog niet aangepaste) state op de undo-stack. Omdat elke
  // mutatie hier via structuredClone werkt, muteert niets ooit een bestaande state-referentie
  // in-place — dus de op de stack gezette snapshot blijft voor altijd onaangeroerd en veilig.
  const UNDO_MAX = 20;
  const [undoStack, setUndoStack] = useState([]);
  const undoStackRef = useRef(undoStack);
  undoStackRef.current = undoStack;

  const update = (fn) => {
    setUndoStack(stack => [...stack.slice(-(UNDO_MAX - 1)), state]);
    setState(prev => fn(structuredClone(prev)));
  };

  const kanOngedaanMaken = undoStack.length > 0;
  const ongedaanMaken = () => {
    const stack = undoStackRef.current;
    if(stack.length === 0) return;
    const vorige = stack[stack.length - 1];
    setUndoStack(s => s.slice(0, -1));
    setState(vorige);
  };

  // Ctrl/Cmd+Z voor ongedaan maken, behalve terwijl er in een tekstveld getypt wordt — daar
  // hoort de eigen undo van de browser (voor de tekst in dat veld) niet overschreven te worden.
  useEffect(() => {
    const handler = (e) => {
      if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
      const tag = document.activeElement?.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      e.preventDefault();
      ongedaanMaken();
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const addPositie = (naam, sectie, ingang, uniform, vereistPortofoon, plakdienst, leidinggevende, startTijd, eindTijd) => update(s => {
    s.posities.push({id:uid('pos'), naam, sectie, ingang: ingang || '', uniform: uniform||[], vereistPortofoon: !!vereistPortofoon, plakdienst: !!plakdienst, leidinggevende: !!leidinggevende, materiaal:[], startTijd: startTijd || '', eindTijd: eindTijd || ''});
    return s;
  });
  const updatePositie = (id, patch) => update(s => {
    const p = s.posities.find(p=>p.id===id);
    if(p) Object.assign(p, patch);
    return s;
  });
  const removePositie = (id) => update(s => {
    s.posities = s.posities.filter(p=>p.id!==id);
    const verwijderdeIndelingIds = new Set(s.indelingen.filter(i=>i.positieId===id).map(i=>i.id));
    s.indelingen = s.indelingen.filter(i=>i.positieId!==id);
    s.checkins = s.checkins.filter(c=>!verwijderdeIndelingIds.has(c.indelingId));
    return s;
  });
  // Dupliceert een positie (zonder de indelingen erop) direct onder het origineel in de lijst.
  const duplicatePositie = (id) => update(s => {
    const index = s.posities.findIndex(p=>p.id===id);
    if(index===-1) return s;
    const origineel = s.posities[index];
    const kopie = {...structuredClone(origineel), id:uid('pos'), naam: origineel.naam + ' (kopie)'};
    s.posities.splice(index+1, 0, kopie);
    return s;
  });
  const addMateriaalRegel = (positieId, naam, aantal) => update(s => {
    const p = s.posities.find(p=>p.id===positieId);
    if(p) p.materiaal.push({naam, aantal: Number(aantal)||1});
    return s;
  });
  const removeMateriaalRegel = (positieId, idx) => update(s => {
    const p = s.posities.find(p=>p.id===positieId);
    if(p) p.materiaal.splice(idx,1);
    return s;
  });

  // Elke CSV-rij wordt een eigen positie, ook als naam+sectie+ingang gelijk zijn aan een
  // bestaande positie — meerdere identiek genoemde posities (bv. drie keer "Steward" onder
  // dezelfde ingang) zijn drie losse plekken, geen duplicaten om samen te voegen.
  const importPosities = (rows) => update(s => {
    rows.forEach(r => {
      const naam = r.naam || r.name;
      if(!naam) return;
      const sectie = r.sectie || '';
      const ingang = r.ingang || '';
      const startTijd = r.starttijd || '';
      const eindTijd = r.eindtijd || '';
      const uniformRaw = r.uniform || '';
      const uniform = uniformRaw.split(/[|,]/).map(u=>u.trim()).filter(Boolean)
        .map(u => UNIFORM_OPTIES.find(o => o.toLowerCase()===u.toLowerCase()) || u);
      const portofoonRaw = (r.portofoon || r.vereistportofoon || '').toLowerCase();
      const vereistPortofoon = ['ja','yes','1','true','x'].includes(portofoonRaw);
      const plakdienstRaw = (r.plakdienst || '').toLowerCase();
      const plakdienst = ['ja','yes','1','true','x'].includes(plakdienstRaw);
      const leidinggevendeRaw = (r.leidinggevende || '').toLowerCase();
      const leidinggevende = ['ja','yes','1','true','x'].includes(leidinggevendeRaw);
      const p = {id:uid('pos'), naam, sectie, ingang, startTijd, eindTijd, uniform, vereistPortofoon, plakdienst, leidinggevende, materiaal:[]};
      s.posities.push(p);
      // optioneel materiaal kolom: "materiaal" met "naam:aantal|naam:aantal"
      if(r.materiaal){
        r.materiaal.split('|').forEach(part => {
          const [mnaam, maantal] = part.split(':').map(x=>x && x.trim());
          if(mnaam) p.materiaal.push({naam:mnaam, aantal: Number(maantal)||1});
        });
      }
    });
    return s;
  });

  const naamBestaatAl = (lijst, naam, ignoreId) => lijst.some(x => naamGelijk(x.naam, naam) && x.id!==ignoreId);

  const addWerknemer = (naam, beveiligingspas, organisatie) => {
    let error = null;
    update(s => {
      if(naamBestaatAl(s.werknemers, naam)){
        error = `Er bestaat al een werknemer met de naam "${naam}".`;
        return s;
      }
      s.werknemers.push({id:uid('wn'), naam, beveiligingspas: !!beveiligingspas, organisatie: organisatie || ''});
      return s;
    });
    return error;
  };
  const updateWerknemer = (id, patch) => {
    let error = null;
    update(s => {
      if(patch.naam && naamBestaatAl(s.werknemers, patch.naam, id)){
        error = `Er bestaat al een werknemer met de naam "${patch.naam}".`;
        return s;
      }
      const w = s.werknemers.find(w=>w.id===id);
      if(w) Object.assign(w, patch);
      return s;
    });
    return error;
  };
  const removeWerknemer = (id) => update(s => {
    s.werknemers = s.werknemers.filter(v=>v.id!==id);
    const verwijderdeIndelingIds = new Set(s.indelingen.filter(i=>i.werknemerId===id).map(i=>i.id));
    s.indelingen = s.indelingen.filter(i=>i.werknemerId!==id);
    s.checkins = s.checkins.filter(c=>!verwijderdeIndelingIds.has(c.indelingId));
    return s;
  });
  const importWerknemers = (rows) => update(s => {
    rows.forEach(r => {
      const naam = r.naam || r.name;
      if(!naam) return;
      if(naamBestaatAl(s.werknemers, naam)) return; // skip duplicaten stilletjes bij import
      const pasRaw = (r.beveiligingspas || r.pas || '').toLowerCase();
      const pas = ['ja','yes','1','true','x'].includes(pasRaw);
      s.werknemers.push({id:uid('wn'), naam, beveiligingspas: pas, organisatie: r.organisatie || ''});
    });
    return s;
  });

  // Geeft een waarschuwingstekst terug als de werknemer geen beveiligingspas heeft
  // én de positie een ander uniform vereist dan uitsluitend Crowd Support. Geen harde blokkade.
  const checkBeveiligingspasWaarschuwing = (positie, werknemer) => {
    if(!positie || !werknemer) return null;
    if(werknemer.beveiligingspas) return null;
    const uniform = positie.uniform || [];
    const alleenCrowdSupport = uniform.length > 0 && uniform.every(u => u === 'Crowd Support');
    if(uniform.length === 0 || alleenCrowdSupport) return null;
    return `${werknemer.naam} heeft geen beveiligingspas, maar wordt ingedeeld op "${positie.naam}" (uniform: ${uniform.join(', ')}). Dit is normaliter alleen toegestaan voor Crowd Support.`;
  };

  // forceerExtra: negeert de "positie al bezet"-controle, zodat iemand er als extra bij
  // gekoppeld wordt ook als de positie geen plakdienst is. Wordt gebruikt bij het ad-hoc
  // aanmaken van een nieuwe werknemer aan de balie (zie BalieTab), niet bij de gewone indeling.
  const addIndeling = (positieId, werknemerId, forceerExtra) => {
    let error = null;
    update(s => {
      const positie = s.posities.find(p=>p.id===positieId);
      const exists = s.indelingen.some(i=>i.positieId===positieId && i.werknemerId===werknemerId);
      if(exists){ error = 'Deze werknemer is al gekoppeld aan deze positie.'; return s; }
      if(!positie?.plakdienst && !forceerExtra){
        const bezet = s.indelingen.some(i=>i.positieId===positieId);
        if(bezet){ error = 'Deze positie is al bezet door iemand anders. Vink \'Plakdienst\' aan bij de positie als hier meerdere mensen tegelijk op mogen staan.'; return s; }
      }
      s.indelingen.push({id:uid('ind'), positieId, werknemerId});
      return s;
    });
    return error;
  };
  const removeIndeling = (id) => update(s => {
    s.indelingen = s.indelingen.filter(i=>i.id!==id);
    s.checkins = s.checkins.filter(c=>c.indelingId!==id);
    return s;
  });

  const ensureCheckin = (s, indelingId) => {
    let c = s.checkins.find(c=>c.indelingId===indelingId);
    if(!c){
      c = {id:uid('ci'), indelingId, status:'gepland', inTijd:null, uitTijd:null, materiaalUitgegeven:[]};
      s.checkins.push(c);
    }
    return c;
  };

  const checkIn = (indelingId, materiaalOverride, inTijdOverride) => {
    // Snapshot wordt vóór de update() berekend, uit de huidige (al gecommitte) state.
    // Eerder werd dit binnen de setState-updater zelf berekend, maar die updater draait
    // niet gegarandeerd synchroon (dat is een React-implementatiedetail, geen contract) —
    // op sommige machines/browsers bleef 'snapshot' daardoor null bij het uitlezen hierna,
    // waardoor het bonnetje niet verscheen ondanks dat het inchecken zelf wel lukte.
    const indeling = state.indelingen.find(i=>i.id===indelingId);
    if(!indeling) return null;
    const positie = state.posities.find(p=>p.id===indeling.positieId);
    const werknemer = state.werknemers.find(w=>w.id===indeling.werknemerId);
    const inTijd = inTijdOverride || nowTime();
    const bron = materiaalOverride || positie.materiaal;
    // Elk materiaal-item krijgt een eigen 'ingeleverd'-vlag, los van de incheck/uitcheck-status,
    // zodat losse items na uitchecken nog apart als ingeleverd gemarkeerd kunnen worden.
    const materiaalUitgegeven = bron.map(m=>({naam:m.naam, aantal:m.aantal, ingeleverd:false}));

    // Naam van de leidinggevende voor op de bon — alleen gezocht als deze werknemer zelf niet
    // op een leidinggevende-positie wordt ingecheckt. Eerst geprobeerd op ingang-niveau (zelfde
    // sectie + zelfde ingang); is daar niemand ingecheckt (of geen ingang van toepassing), dan
    // valt dit terug op de leidinggevende van de hele sector (positie zonder ingang).
    let leidinggevendeNaam = null;
    if(!positie.leidinggevende && positie.sectie){
      const vindIngecheckteLeiding = (leidingPositie) => {
        const leidingIndeling = leidingPositie && state.indelingen.find(i => i.positieId===leidingPositie.id);
        const leidingCheckin = leidingIndeling && state.checkins.find(c => c.indelingId===leidingIndeling.id && c.status==='ingecheckt');
        const leidingWerknemer = leidingCheckin && state.werknemers.find(w => w.id===leidingIndeling.werknemerId);
        return leidingWerknemer?.naam || null;
      };
      if(positie.ingang){
        const leidingIngang = state.posities.find(p => p.sectie===positie.sectie && p.ingang===positie.ingang && p.leidinggevende);
        leidinggevendeNaam = vindIngecheckteLeiding(leidingIngang);
      }
      if(!leidinggevendeNaam){
        const leidingSector = state.posities.find(p => p.sectie===positie.sectie && !p.ingang && p.leidinggevende);
        leidinggevendeNaam = vindIngecheckteLeiding(leidingSector);
      }
    }

    update(s => {
      const c = ensureCheckin(s, indelingId);
      c.status = 'ingecheckt';
      c.inTijd = inTijd;
      c.materiaalUitgegeven = materiaalUitgegeven;
      // Eén fysieke werknemer kan op meerdere posities tegelijk staan (bv. regulier + plakdienst)
      // — die hoeft maar één keer bij de balie langs, dus de nog geplande overige indelingen van
      // dezelfde werknemer worden meteen mee ingecheckt (met het eigen standaardmateriaal van die
      // positie, aangezien daar geen apart materiaalscherm voor is doorlopen).
      s.indelingen.filter(i => i.werknemerId===indeling.werknemerId && i.id!==indelingId).forEach(ind => {
        const oc = ensureCheckin(s, ind.id);
        if(oc.status === 'gepland'){
          const overigePositie = s.posities.find(p=>p.id===ind.positieId);
          oc.status = 'ingecheckt';
          oc.inTijd = inTijd;
          oc.materiaalUitgegeven = (overigePositie?.materiaal||[]).map(m=>({naam:m.naam, aantal:m.aantal, ingeleverd:false}));
        }
      });
      return s;
    });

    return {werknemer, positie, inTijd, materiaal: materiaalUitgegeven, event: state.event, leidinggevendeNaam};
  };

  const updateMateriaalUitgegeven = (indelingId, materiaal) => update(s => {
    const c = ensureCheckin(s, indelingId);
    c.materiaalUitgegeven = materiaal.map(m=>({ingeleverd:false, ...m}));
    return s;
  });

  // ingeleverdNamen: Set van materiaalnamen (lowercase) die bij het afmelden als ingeleverd zijn aangevinkt.
  // Alles wat niet in die set zit, blijft op 'niet ingeleverd' staan en is dus zichtbaar in Openstaand materiaal.
  const checkOut = (indelingId, ingeleverdNamen, opmerking, uitTijdOverride) => update(s => {
    const c = ensureCheckin(s, indelingId);
    c.status = 'uitgecheckt';
    c.uitTijd = uitTijdOverride || nowTime();
    if(ingeleverdNamen && c.materiaalUitgegeven){
      c.materiaalUitgegeven = c.materiaalUitgegeven.map(m => ({
        ...m,
        ingeleverd: ingeleverdNamen.has(m.naam.toLowerCase())
      }));
    }
    if(opmerking !== undefined) c.opmerking = opmerking;
    // Zelfde redenering als bij inchecken: de overige, nog ingecheckte indelingen van deze
    // werknemer (bv. de reguliere dienst naast de plakdienst) checken automatisch mee uit,
    // op hetzelfde tijdstip — het eigen materiaal van die positie blijft gewoon openstaand
    // totdat dat apart als ingeleverd wordt afgevinkt.
    const indeling = s.indelingen.find(i=>i.id===indelingId);
    if(indeling){
      s.indelingen.filter(i => i.werknemerId===indeling.werknemerId && i.id!==indelingId).forEach(ind => {
        const oc = ensureCheckin(s, ind.id);
        if(oc.status === 'ingecheckt'){
          oc.status = 'uitgecheckt';
          oc.uitTijd = c.uitTijd;
        }
      });
    }
    return s;
  });

  // Markeert één los materiaal-item van een werknemer als (niet) ingeleverd.
  // Werkt ongeacht of de werknemer al is uitgecheckt, zodat dit ook achteraf vanuit
  // 'Openstaand materiaal' afgehandeld kan worden.
  const setMateriaalItemIngeleverd = (indelingId, itemIndex, ingeleverd) => update(s => {
    const c = s.checkins.find(c=>c.indelingId===indelingId);
    if(c && c.materiaalUitgegeven && c.materiaalUitgegeven[itemIndex]){
      c.materiaalUitgegeven[itemIndex] = {...c.materiaalUitgegeven[itemIndex], ingeleverd};
    }
    return s;
  });

  const markNoShow = (indelingId) => update(s => {
    const c = ensureCheckin(s, indelingId);
    c.status = 'no-show';
    // Zelfde cascade-principe als bij in-/uitchecken: de overige nog geplande indelingen van
    // dezelfde werknemer worden ook als no-show gemarkeerd — het gaat om één fysieke persoon.
    const indeling = s.indelingen.find(i=>i.id===indelingId);
    if(indeling){
      s.indelingen.filter(i => i.werknemerId===indeling.werknemerId && i.id!==indelingId).forEach(ind => {
        const oc = ensureCheckin(s, ind.id);
        if(oc.status === 'gepland') oc.status = 'no-show';
      });
    }
    return s;
  });

  const resetCheckin = (indelingId) => update(s => {
    const indeling = s.indelingen.find(i=>i.id===indelingId);
    // Cascade: ook de checkin-status van de overige indelingen van dezelfde werknemer terugzetten
    // naar 'gepland', zodat de samengevoegde balie-regel weer als één geheel klopt.
    const teVerwijderenIds = new Set([indelingId]);
    if(indeling){
      s.indelingen.filter(i => i.werknemerId===indeling.werknemerId).forEach(i => teVerwijderenIds.add(i.id));
    }
    s.checkins = s.checkins.filter(c => !teVerwijderenIds.has(c.indelingId));
    return s;
  });

  // ---- export / import full state ----
  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${state.event.name.replace(/\s+/g,'_')}_data.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  // Zichtbare terugkoppeling over opslaan/inladen: {type:'success'|'error', bericht}. Succesmeldingen
  // verdwijnen vanzelf na een paar seconden (zie effect verderop), foutmeldingen blijven staan tot
  // je ze sluit of tot er een nieuwe melding overheen komt — die mag je niet kunnen missen.
  const [appMelding, setAppMelding] = useState(null);

  // Ondersteuning voor de File System Access API: hiermee kan een ingeladen JSON-bestand
  // later automatisch teruggeschreven worden naar dezelfde plek, zonder downloadknop.
  // Alleen beschikbaar in Chrome/Edge; Firefox/Safari vallen terug op het gewone bestandsveld.
  const ondersteuntBestandsToegang = typeof window !== 'undefined' && typeof window.showOpenFilePicker === 'function';
  const [importedFileHandle, setImportedFileHandle] = useState(null);
  const importedFileHandleRef = useRef(null);
  importedFileHandleRef.current = importedFileHandle;

  const toepassenGeimporteerdeJSON = (tekst) => {
    try {
      const data = JSON.parse(tekst);
      if(!data.instellingen) data.instellingen = structuredClone(emptyState.instellingen);
      if(!data.instellingen.materiaalOpties) data.instellingen.materiaalOpties = [...DEFAULT_MATERIAAL_OPTIES];
      if(!data.instellingen.bonAccentkleur) data.instellingen.bonAccentkleur = emptyState.instellingen.bonAccentkleur;
      if(!data.instellingen.bonVoettekst) data.instellingen.bonVoettekst = emptyState.instellingen.bonVoettekst;
      if(!data.instellingen.bonLettergrootte) data.instellingen.bonLettergrootte = emptyState.instellingen.bonLettergrootte;
      data.posities = (data.posities||[]).map(p => ({vereistPortofoon:false, plakdienst:false, leidinggevende:false, ingang:'', ...p}));
      data.werknemers = (data.werknemers||[]).map(w => ({organisatie:'', ...w}));
      setState(data);
    } catch(err){ alert('Kon bestand niet lezen: ' + err.message); }
  };

  // Fallback-pad: gewoon bestandsveld (<input type="file">), levert alleen een File,
  // geen FileSystemFileHandle — dus geen automatisch terugschrijven mogelijk.
  const importJSONFile = (file) => {
    setImportedFileHandle(null);
    const reader = new FileReader();
    reader.onload = (e) => toepassenGeimporteerdeJSON(e.target.result);
    reader.readAsText(file);
  };

  // Voorkeurspad in Chrome/Edge: opent de systeembestandskiezer en onthoudt de handle,
  // zodat latere opslagmomenten rechtstreeks naar hetzelfde bestand kunnen terugschrijven.
  const importJSONMetHandle = async () => {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{description: 'JSON', accept: {'application/json': ['.json']}}],
      });
      const file = await handle.getFile();
      const tekst = await file.text();
      toepassenGeimporteerdeJSON(tekst);
      setImportedFileHandle(handle);
      setAppMelding({type:'success', bericht:`"${file.name}" ingeladen en gekoppeld — wijzigingen worden hier automatisch in opgeslagen.`});
    } catch(err){
      if(err && err.name === 'AbortError') return; // gebruiker heeft de bestandskiezer geannuleerd
      setAppMelding({type:'error', bericht:'Kon bestand niet lezen: ' + err.message});
    }
  };

  // Sleep-en-laat-los-pad: probeert (in Chrome/Edge) via het gesleepte item ook meteen een
  // FileSystemFileHandle te bemachtigen, zodat slepen net zo goed automatisch terugschrijven
  // oplevert als de bestandskiezer. Lukt dat niet (Firefox/Safari, of oudere browsers), dan
  // valt het terug op een gewone File-lezing zonder koppeling — en dat wordt nu expliciet
  // gemeld, in plaats van stilletjes te gebeuren.
  const importJSONVanDrop = async (dataTransferItem) => {
    try {
      let handle = null;
      if(ondersteuntBestandsToegang && typeof dataTransferItem.getAsFileSystemHandle === 'function'){
        try { handle = await dataTransferItem.getAsFileSystemHandle(); } catch(e){ handle = null; }
      }
      const file = handle ? await handle.getFile() : dataTransferItem.getAsFile();
      if(!file) return;
      const tekst = await file.text();
      toepassenGeimporteerdeJSON(tekst);
      setImportedFileHandle(handle);
      if(handle){
        setAppMelding({type:'success', bericht:`"${file.name}" ingeladen en gekoppeld — wijzigingen worden hier automatisch in opgeslagen.`});
      } else {
        setAppMelding({type:'error', bericht:`"${file.name}" is ingeladen, maar NIET gekoppeld — wijzigingen worden dus niet automatisch teruggeschreven. Gebruik 'Bestand kiezen' voor automatisch opslaan, of sla straks handmatig op.`});
      }
    } catch(err){
      setAppMelding({type:'error', bericht:'Kon bestand niet lezen: ' + err.message});
    }
  };

  const loskoppelenGeimporteerdBestand = () => setImportedFileHandle(null);

  // Schrijft de huidige state terug naar het gekoppelde bestand (indien aanwezig). De browser
  // vraagt hiervoor bij de eerste keer eenmalig om schrijftoestemming. Zowel gelukt als mislukt
  // wordt nu zichtbaar gemeld (i.p.v. alleen console.error bij een fout).
  const schrijfNaarGekoppeldBestand = async (handle, data) => {
    try {
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(data, null, 2));
      await writable.close();
      setLaatsteAutosave(nowTime());
      setAppMelding({type:'success', bericht:`Opgeslagen naar ${handle.name}.`});
      return true;
    } catch(err){
      console.error('Kon niet automatisch terugschrijven naar het geïmporteerde bestand:', err);
      setAppMelding({type:'error', bericht:`Opslaan naar "${handle.name}" is mislukt (${err.message || 'onbekende fout'}). Koppel het bestand opnieuw via 'Bestand kiezen', of exporteer handmatig als back-up.`});
      return false;
    }
  };

  // ---- opslaan: handmatig via knop, en automatisch elke 30 minuten ----
  // Voorkeur: als er een gekoppeld bestand is (via importJSONMetHandle), wordt daar altijd
  // stil naar teruggeschreven — zowel handmatig als automatisch, zonder downloads.
  // Is er geen gekoppeld bestand, dan downloadt de automatische controle NIET meer stilletjes
  // om de zoveel minuten een nieuw bestand (dat werd als hinderlijk ervaren); in plaats daarvan
  // verschijnt een korte melding die expliciet vraagt of je nu handmatig wilt opslaan.
  const [laatsteAutosave, setLaatsteAutosave] = useState(null);
  const [toonOpslaanHerinnering, setToonOpslaanHerinnering] = useState(false);
  const stateRef = useRef(state);
  stateRef.current = state;

  // ---- Alleen-lezen (kijk)modus ----
  // Laat iemand anders het bestand read-only volgen terwijl een collega er actief in werkt.
  // Gebruikt een eigen bestandshandle (nooit het gekoppelde schrijf-handle uit importedFileHandleRef)
  // en ververst zichzelf periodiek vanaf schijf — er wordt in deze modus nooit teruggeschreven.
  const [alleenLezenModus, setAlleenLezenModus] = useState(false);
  const [laatsteVerversing, setLaatsteVerversing] = useState(null);
  const alleenLezenModusRef = useRef(false);
  alleenLezenModusRef.current = alleenLezenModus;
  const alleenLezenHandleRef = useRef(null);
  const alleenLezenVernieuwFileRef = useRef(null); // verborgen file-input voor handmatig verversen zonder handle
  const mainRef = useRef(null);

  // Zet de inert-property rechtstreeks op het DOM-element via de ref, i.p.v. als JSX-attribuut —
  // React herkent 'inert' niet betrouwbaar als boolean HTML-attribuut, waardoor het via JSX soms
  // niet (op tijd) werd toegepast en aanpassingen in kijkmodus na de volgende automatische
  // ververing weer 'terugsprongen' in plaats van meteen geblokkeerd te zijn.
  useEffect(() => {
    if(mainRef.current) mainRef.current.inert = alleenLezenModus;
  }, [alleenLezenModus]);

  const laadAlleenLezenData = async (handle) => {
    try {
      const file = await handle.getFile();
      const tekst = await file.text();
      setState(JSON.parse(tekst));
      setLaatsteVerversing(nowTime());
      return true;
    } catch(err){
      setAppMelding({type:'error', bericht:'Kon het bestand niet lezen: ' + (err.message || 'onbekende fout')});
      return false;
    }
  };

  const startAlleenLezenMetHandle = async () => {
    try {
      const [handle] = await window.showOpenFilePicker({types:[{description:'Plotbord JSON', accept:{'application/json':['.json']}}]});
      const gelukt = await laadAlleenLezenData(handle);
      if(!gelukt) return;
      alleenLezenHandleRef.current = handle;
      setAlleenLezenModus(true);
      setStarted(true);
      setTab('balie');
    } catch(err){
      if(err.name !== 'AbortError') setAppMelding({type:'error', bericht:'Kon het bestand niet openen: ' + (err.message || 'onbekende fout')});
    }
  };

  // Zonder File System Access API (Firefox/Safari) kan een bestand niet vanzelf herlezen worden —
  // daarvoor is telkens een nieuwe, expliciete gebruikersactie (bestandskeuze) nodig. Dit stukje
  // wordt daarom zowel bij de eerste keer openen als bij elke handmatige ververs-actie gebruikt.
  const verwerkAlleenLezenBestand = (file, { navigeren }) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        setState(JSON.parse(e.target.result));
        setLaatsteVerversing(nowTime());
        if(navigeren){
          alleenLezenHandleRef.current = null;
          setAlleenLezenModus(true);
          setStarted(true);
          setTab('balie');
        }
      } catch(err){
        setAppMelding({type:'error', bericht:'Dit is geen geldig Plotbord-bestand.'});
      }
    };
    reader.readAsText(file);
  };
  const startAlleenLezenVanBestand = (file) => verwerkAlleenLezenBestand(file, {navigeren: true});
  const ververAlleenLezenVanBestand = (file) => verwerkAlleenLezenBestand(file, {navigeren: false});

  const ververAlleenLezen = () => {
    if(alleenLezenHandleRef.current) laadAlleenLezenData(alleenLezenHandleRef.current);
  };

  const stopAlleenLezen = () => {
    alleenLezenHandleRef.current = null;
    setAlleenLezenModus(false);
    setStarted(false);
    setState(structuredClone(emptyState));
  };

  // Ververst zichzelf periodiek vanaf schijf — alleen mogelijk met een File System Access-handle
  // (Chrome/Edge). Zonder handle (Firefox/Safari) kan alleen handmatig ververst worden via
  // ververAlleenLezen, omdat browsers een bestand niet zonder nieuwe gebruikersactie mogen herlezen.
  useEffect(() => {
    if(!alleenLezenModus || !alleenLezenHandleRef.current) return;
    const interval = setInterval(() => laadAlleenLezenData(alleenLezenHandleRef.current), 8000);
    return () => clearInterval(interval);
  }, [alleenLezenModus]);

  const heeftOpslaanbareData = (s) => s.posities.length > 0 || s.werknemers.length > 0 || s.indelingen.length > 0;

  // Detecteert of er de afgelopen 10 minuten een in- of uitcheck is geweest, om het automatisch
  // opslaan te versnellen tijdens een drukke instroom (minder dataverlies bij een crash op het
  // drukste moment). Vergelijkt op tijd-van-de-dag, zoals ook bij isTeLaat.
  const heeftRecenteCheckinActiviteit = (s) => {
    const nu = new Date();
    const nuMin = nu.getHours() * 60 + nu.getMinutes();
    return s.checkins.some(c => {
      const tijd = c.uitTijd || c.inTijd;
      if(!tijd) return false;
      const [uur, min] = tijd.split(':').map(Number);
      return Math.abs(nuMin - (uur * 60 + min)) <= 10;
    });
  };

  const downloadBackup = (huidigeState, label) => {
    try {
      const blob = new Blob([JSON.stringify(huidigeState, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const bestandsnaam = `${huidigeState.event.name.replace(/\s+/g,'_')}_${label}_${nowTime().replace(':','-')}.json`;
      a.href = url; a.download = bestandsnaam;
      a.click();
      URL.revokeObjectURL(url);
      setLaatsteAutosave(nowTime());
      setAppMelding({type:'success', bericht:`Gedownload als ${bestandsnaam}.`});
      return true;
    } catch(err){
      setAppMelding({type:'error', bericht:'Downloaden is mislukt: ' + (err.message || 'onbekende fout')});
      return false;
    }
  };

  // Handmatige "Opslaan"-knop: schrijft terug naar het gekoppelde bestand als dat er is,
  // anders downloadt deze (expliciet, op verzoek van de gebruiker) alsnog een bestand.
  // De melding (gelukt/mislukt) wordt door schrijfNaarGekoppeldBestand/downloadBackup zelf getoond.
  const handmatigOpslaan = () => {
    const huidigeState = stateRef.current;
    if(!heeftOpslaanbareData(huidigeState)) return false;
    laatsteOpslagMomentRef.current = Date.now();
    if(importedFileHandleRef.current){
      schrijfNaarGekoppeldBestand(importedFileHandleRef.current, huidigeState);
    } else {
      downloadBackup(huidigeState, 'opslag');
    }
    setToonOpslaanHerinnering(false);
    return true;
  };

  // Autosave-interval: normaal elke 30 minuten, maar tijdens een drukke instroom (recente
  // in-/uitcheck-activiteit) elke 5 minuten, zodat een crash op het drukste moment maximaal
  // een paar minuten aan mutaties kost i.p.v. een half uur. Er wordt elke 5 minuten gecontroleerd
  // of de (dynamische) drempel al verstreken is, in plaats van de timer zelf te herstarten.
  const laatsteOpslagMomentRef = useRef(Date.now());
  useEffect(() => {
    const interval = setInterval(() => {
      if(alleenLezenModusRef.current) return; // kijkmodus schrijft nooit terug
      const huidigeState = stateRef.current;
      if(!heeftOpslaanbareData(huidigeState)) return;
      const drempelMin = heeftRecenteCheckinActiviteit(huidigeState) ? 5 : 30;
      const minutenSindsLaatsteOpslag = (Date.now() - laatsteOpslagMomentRef.current) / 60000;
      if(minutenSindsLaatsteOpslag < drempelMin) return;
      laatsteOpslagMomentRef.current = Date.now();
      if(importedFileHandleRef.current){
        schrijfNaarGekoppeldBestand(importedFileHandleRef.current, huidigeState);
      } else {
        setToonOpslaanHerinnering(true);
      }
    }, 5 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);

  // Waarschuwing bij het sluiten/verlaten van de pagina. Browsers staan geen eigen
  // JS-dialoogvenster (met 'Ja'/'Nee') toe op dit moment — alleen hun eigen generieke
  // waarschuwing. Op dit moment kán er niet meer gevraagd worden, dus wordt hier — als
  // laatste vangnet — altijd nog een terugschrijfpoging gedaan (indien gekoppeld) én
  // sowieso een back-up gedownload, zodat er in elk geval iets bewaard blijft.
  useEffect(() => {
    const handler = (e) => {
      if(alleenLezenModusRef.current) return; // niets om te bewaren, geen waarschuwing nodig
      const huidigeState = stateRef.current;
      if(!heeftOpslaanbareData(huidigeState)) return;
      if(importedFileHandleRef.current) schrijfNaarGekoppeldBestand(importedFileHandleRef.current, huidigeState);
      downloadBackup(huidigeState, 'afsluiten');
      e.preventDefault();
      e.returnValue = '';
      return '';
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, []);

  // Succesmeldingen verdwijnen vanzelf; foutmeldingen blijven staan tot de gebruiker ze sluit
  // (of tot een volgende melding ze vervangt), zodat een mislukt opslaan niet gemist kan worden.
  useEffect(() => {
    if(appMelding?.type !== 'success') return;
    const timeout = setTimeout(() => setAppMelding(m => (m === appMelding ? null : m)), 4000);
    return () => clearTimeout(timeout);
  }, [appMelding]);

  // Print-aansturing zit nu in de Bonnetje component zelf (respecteert printerActief/autoPrint).

  const tabs = [
    {id:'balie', label:'Balie'},
    {id:'posities', label:'Posities & secties'},
    {id:'werknemers', label:'Werknemers'},
    {id:'indeling', label:'Indeling'},
    {id:'dashboard', label:'Dashboard'},
    {id:'exports', label:'Exports'},
    {id:'edit', label:'Edit & data'},
  ];

  if(!ingelogd){
    return <LoginScreen onSuccess={()=>setIngelogd(true)} />;
  }

  if(!started){
    return <StartScreen state={state} setState={setState} importJSONFile={importJSONFile}
      importJSONMetHandle={importJSONMetHandle} importJSONVanDrop={importJSONVanDrop} ondersteuntBestandsToegang={ondersteuntBestandsToegang}
      importedFileHandle={importedFileHandle} appMelding={appMelding} setAppMelding={setAppMelding}
      importPosities={importPosities} importWerknemers={importWerknemers}
      startAlleenLezenMetHandle={startAlleenLezenMetHandle} startAlleenLezenVanBestand={startAlleenLezenVanBestand}
      onStart={()=>{ setStarted(true); setTab('balie'); }} />;
  }

  return (
    <div style={{minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <style>{`
        @media print {
          @page { size: 76mm 297mm; margin: 0; }
          html, body { width: 76mm; margin: 0; padding: 0; }
          header, nav, main, footer, .no-print { display: none !important; }
          #bonnetje-overlay { position: static !important; inset: auto !important; background: none !important; display: block !important; }
          #bonnetje-card { position: static !important; background: none !important; padding: 0 !important; margin: 0 !important; max-width: none !important; width: auto !important; border-radius: 0 !important; }
          #bonnetje { position: static !important; width: 76mm !important; max-width: 76mm !important; margin: 0 !important; font-size: ${state.instellingen?.bonLettergrootte || 11}pt !important; padding: 2mm 3mm 2mm 7mm !important; border: none !important; break-inside: avoid !important; page-break-inside: avoid !important; }
        }
        input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--signal); outline-offset:2px; box-shadow: var(--focus-ring); }
        .card { transition: box-shadow .2s cubic-bezier(.4,0,.2,1), transform .2s cubic-bezier(.4,0,.2,1); }
        @media (prefers-reduced-motion: reduce){ *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
      `}</style>

      <header style={{
        background:'var(--header-bg)', color:'#fff', padding:'18px 28px', boxShadow:'0 1px 2px rgba(20,27,43,.10)',
        display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12
      }}>
        <div style={{display:'flex', alignItems:'baseline', gap:14}}>
          <span style={{fontFamily:'var(--display)', fontSize:24, fontWeight:700, letterSpacing:'-0.01em'}}>Scorpions Security</span>
          <span style={{fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'.12em', color:'var(--blue-300, #8CC4F3)'}}>Plotbord</span>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:14, fontSize:13, opacity:0.88}}>
          <span>{state.event.name}</span>
          <span style={{opacity:0.5}}>·</span>
          <span>{state.event.date}</span>
          {alleenLezenModus && (
            <span style={{background:'rgba(255,255,255,0.15)', padding:'4px 10px', borderRadius:4, fontWeight:700}}>
              Kijkmodus{laatsteVerversing ? ` · ververst ${laatsteVerversing}` : ''}
            </span>
          )}
          <Button variant="ghost" onClick={()=>setDonkereModus(d=>!d)}
            title="Donkere modus (voor avond/nacht-evenementen)" style={{padding:'7px 14px', fontSize:13, color:'#fff', borderColor:'rgba(255,255,255,0.4)'}}>
            {donkereModus ? 'Licht' : 'Donker'}
          </Button>
          {alleenLezenModus ? (
            <>
              {alleenLezenHandleRef.current ? (
                <Button variant="ghost" onClick={ververAlleenLezen} style={{padding:'7px 14px', fontSize:13, color:'#fff', borderColor:'rgba(255,255,255,0.4)'}}>
                  Nu verversen
                </Button>
              ) : (
                <>
                  <Button variant="ghost" onClick={()=>alleenLezenVernieuwFileRef.current.click()} style={{padding:'7px 14px', fontSize:13, color:'#fff', borderColor:'rgba(255,255,255,0.4)'}}>
                    Nu verversen
                  </Button>
                  <input ref={alleenLezenVernieuwFileRef} type="file" accept=".json" style={{display:'none'}}
                    onChange={e=>{ const file=e.target.files[0]; if(file) ververAlleenLezenVanBestand(file); e.target.value=''; }} />
                </>
              )}
              <Button variant="ghost" onClick={stopAlleenLezen} style={{padding:'7px 14px', fontSize:13, color:'#fff', borderColor:'rgba(255,255,255,0.4)'}}>
                Stoppen met kijken
              </Button>
            </>
          ) : (
            <>
              <Button variant="ghost" onClick={()=>setStarted(false)} style={{padding:'7px 14px', fontSize:13, color:'#fff', borderColor:'rgba(255,255,255,0.4)'}}>
                Startscherm
              </Button>
              <Button variant="ghost" onClick={ongedaanMaken} disabled={!kanOngedaanMaken}
                title="Ongedaan maken (Ctrl/Cmd+Z)" style={{padding:'7px 14px', fontSize:13, color:'#fff', borderColor:'rgba(255,255,255,0.4)'}}>
                Ongedaan maken
              </Button>
              <Button onClick={handmatigOpslaan} style={{padding:'7px 14px', fontSize:13}}>
                Opslaan{laatsteAutosave ? ` (laatst ${laatsteAutosave})` : ''}
              </Button>
            </>
          )}
        </div>
      </header>

      <nav style={{
        display:'flex', gap:4, padding:'10px 24px', background:'var(--nav-bg)',
        borderBottom:'1px solid var(--line)', overflowX:'auto'
      }}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:'8px 16px', borderRadius:4, border:'none', cursor:'pointer',
            fontWeight:600, fontSize:13.5, fontFamily:'var(--body)',
            background: tab===t.id ? 'var(--moss)' : 'transparent',
            color: tab===t.id ? '#fff' : 'var(--moss-dark)',
            whiteSpace:'nowrap',
          }}>{t.label}</button>
        ))}
      </nav>

      {appMelding && (
        <div className="no-print" style={{
          background: appMelding.type==='error' ? 'var(--pill-warn-bg)' : 'var(--success-bg)',
          color: appMelding.type==='error' ? 'var(--warn)' : 'var(--success-fg)',
          padding:'10px 24px', display:'flex', alignItems:'center', justifyContent:'center', gap:14, flexWrap:'wrap', fontSize:13.5,
        }}>
          <span>{appMelding.type==='error' ? 'Let op — ' : ''}{appMelding.bericht}</span>
          {appMelding.type==='error' && (
            <Button variant="ghost" onClick={()=>setAppMelding(null)} style={{padding:'6px 14px', fontSize:13}}>Sluiten</Button>
          )}
        </div>
      )}

      {toonOpslaanHerinnering && (
        <div className="no-print" style={{
          background:'var(--signal-soft)', color:'var(--pill-signal-fg)', padding:'10px 24px',
          display:'flex', alignItems:'center', justifyContent:'center', gap:14, flexWrap:'wrap', fontSize:13.5,
        }}>
          <span>Er is geen bestand gekoppeld om automatisch in op te slaan. Wil je nu handmatig opslaan?</span>
          <div style={{display:'flex', gap:8}}>
            <Button variant="signal" onClick={handmatigOpslaan} style={{padding:'6px 14px', fontSize:13}}>Opslaan</Button>
            <Button variant="ghost" onClick={()=>setToonOpslaanHerinnering(false)} style={{padding:'6px 14px', fontSize:13}}>Niet nu</Button>
          </div>
        </div>
      )}

      {/* inert blokkeert alle klik-, sleep- en toetsenbordinteractie in de kijkmodus (ook Tab-focus
          op onderliggende invoervelden), zodat er via geen enkele tab per ongeluk iets aangepast
          kan worden — puur meekijken, geen echte beveiliging maar wel een harde UI-vergrendeling.
          De inert-property wordt via een ref rechtstreeks op het DOM-element gezet (in plaats van
          als JSX-attribuut) omdat React's attribuut-doorgifte deze nieuwere HTML-property niet
          betrouwbaar bleek te herkennen — hierdoor 'sprongen' aanpassingen na de eerstvolgende
          automatische ververing terug, in plaats van dat ze meteen geblokkeerd werden.
          pointer-events is een extra vangnet voor het geval inert ergens niet ondersteund wordt. */}
      <main ref={mainRef} style={{flex:1, padding:'28px', maxWidth:1100, margin:'0 auto', width:'100%',
        opacity: alleenLezenModus ? 0.92 : 1, pointerEvents: alleenLezenModus ? 'none' : 'auto'}}>
        {tab==='balie' && <BalieTab state={state} positieById={positieById} werknemerById={werknemerById}
          checkinByIndelingId={checkinByIndelingId}
          checkIn={checkIn} checkOut={checkOut} markNoShow={markNoShow} resetCheckin={resetCheckin}
          addIndeling={addIndeling} addWerknemer={addWerknemer} checkBeveiligingspasWaarschuwing={checkBeveiligingspasWaarschuwing}
          setPrintData={setPrintData} printerActief={printerActief} setPrinterActief={setPrinterActief}
          setMateriaalItemIngeleverd={setMateriaalItemIngeleverd} />}
        {tab==='posities' && <PositiesTab posities={state.posities} addPositie={addPositie} updatePositie={updatePositie}
          removePositie={removePositie} duplicatePositie={duplicatePositie} addMateriaalRegel={addMateriaalRegel} removeMateriaalRegel={removeMateriaalRegel}
          importPosities={importPosities} />}
        {tab==='werknemers' && <WerknemersTab werknemers={state.werknemers} addWerknemer={addWerknemer}
          updateWerknemer={updateWerknemer} removeWerknemer={removeWerknemer} importWerknemers={importWerknemers} />}
        {tab==='indeling' && <IndelingTab state={state} addIndeling={addIndeling}
          removeIndeling={removeIndeling} positieById={positieById} werknemerById={werknemerById}
          checkBeveiligingspasWaarschuwing={checkBeveiligingspasWaarschuwing} />}
        {tab==='dashboard' && <DashboardTab state={state} positieById={positieById} werknemerById={werknemerById} checkinByIndelingId={checkinByIndelingId} />}
        {tab==='exports' && <ExportsTab state={state} positieById={positieById} werknemerById={werknemerById} />}
        {tab==='edit' && <LockedTab>
          <div style={{display:'grid', gap:20}}>
            <DataTab state={state} setState={setState} exportJSON={exportJSON} importJSONFile={importJSONFile}
              importJSONMetHandle={importJSONMetHandle} ondersteuntBestandsToegang={ondersteuntBestandsToegang}
              importedFileHandle={importedFileHandle} loskoppelenGeimporteerdBestand={loskoppelenGeimporteerdBestand}
              laatsteAutosave={laatsteAutosave} />
            <EditTab instellingen={state.instellingen} setState={setState} />
          </div>
        </LockedTab>}
      </main>

      {printData && <Bonnetje data={printData} autoPrint={printerActief} onClose={()=>setPrintData(null)} instellingen={state.instellingen} />}

      <footer style={{textAlign:'center', padding:'18px', fontSize:12, color:'var(--muted-light)'}}>
        Lokale tool — data leeft alleen in deze sessie. Autosave elke 30 minuten{laatsteAutosave ? ` · laatste autosave ${laatsteAutosave}` : ' · nog niet gestart'}.
        {importedFileHandle && ` · gekoppeld aan ${importedFileHandle.name}`}
      </footer>
    </div>
  );
}

// ---------- Inlogscherm ----------
// Let op: dit is geen echte beveiliging, de code staat in de broncode van deze pagina
// (zie ook LockedTab hierboven). Het is een drempel, niet echte toegangscontrole.
function LoginScreen({onSuccess}){
  const [code, setCode] = useState('');
  const [fout, setFout] = useState(false);

  const handleSubmit = () => {
    if(code === LOCK_CODE) onSuccess();
    else { setFout(true); setCode(''); }
  };

  return (
    <div style={{minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:20, background:'var(--paper)'}}>
      <img src={LOGO_BASE64} style={{width:150, marginBottom:18}} alt="Scorpions Security" />
      <Card style={{maxWidth:340, width:'100%', textAlign:'center'}}>
        <h3 style={{marginTop:0, fontFamily:'var(--display)'}}>Inloggen</h3>
        <p style={{fontSize:13.5, color:'var(--muted)'}}>Voer de toegangscode in om het Plotbord te openen.</p>
        <input
          type="password" inputMode="numeric" autoFocus
          style={{...inputStyle, textAlign:'center', fontSize:18, letterSpacing:'0.2em', marginBottom:10}}
          value={code} onChange={e=>{ setCode(e.target.value); setFout(false); }}
          onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); handleSubmit(); } }}
          placeholder="Code"
        />
        {fout && <div style={{fontSize:13, color:'var(--warn)', marginBottom:10}}>Onjuiste code.</div>}
        <Button onClick={handleSubmit} style={{width:'100%'}}>Inloggen</Button>
      </Card>
    </div>
  );
}

// ---------- Startscherm ----------
function StartScreen({state, setState, importJSONFile, importJSONMetHandle, importJSONVanDrop, ondersteuntBestandsToegang, importedFileHandle, appMelding, setAppMelding, importPosities, importWerknemers, startAlleenLezenMetHandle, startAlleenLezenVanBestand, onStart}){
  const jsonFileRef = useRef(null);
  const sjabloonFileRef = useRef(null);
  const alleenLezenFileRef = useRef(null);

  const handleAlleenLezenBestand = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    startAlleenLezenVanBestand(file);
    e.target.value = '';
  };
  const [posBestanden, setPosBestanden] = useState([]);
  const [wnBestanden, setWnBestanden] = useState([]);
  const [sleepActief, setSleepActief] = useState(false);
  const [sjabloonInfo, setSjabloonInfo] = useState(null);

  // Neemt posities, werknemers en indelingen over van een eerder geëxporteerde JSON (bv. van een
  // terugkerende wedstrijd/locatie), met verse id's — in tegenstelling tot 'Inladen' hiernaast
  // wordt dit gebruikt om een NIEUW evenement mee te vullen: checkins en event-naam/datum blijven
  // dus buiten beschouwing (iedereen begint hier weer 'gepland', niet ingecheckt).
  const handleSjabloonJSON = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const oud = JSON.parse(ev.target.result);
        if(!Array.isArray(oud.posities) || !Array.isArray(oud.werknemers) || !Array.isArray(oud.indelingen)){
          throw new Error('Geen geldig Plotbord-bestand (mist posities/werknemers/indelingen).');
        }
        const positieIdMap = {};
        const nieuwePosities = oud.posities.map(p => {
          const nieuwId = uid('pos');
          positieIdMap[p.id] = nieuwId;
          return {...p, id: nieuwId};
        });
        const werknemerIdMap = {};
        const nieuweWerknemers = oud.werknemers.map(w => {
          const nieuwId = uid('wn');
          werknemerIdMap[w.id] = nieuwId;
          return {...w, id: nieuwId};
        });
        const nieuweIndelingen = oud.indelingen
          .filter(ind => positieIdMap[ind.positieId] && werknemerIdMap[ind.werknemerId])
          .map(ind => ({id: uid('ind'), positieId: positieIdMap[ind.positieId], werknemerId: werknemerIdMap[ind.werknemerId]}));
        setState(s => ({...s, posities: nieuwePosities, werknemers: nieuweWerknemers, indelingen: nieuweIndelingen, checkins: []}));
        setSjabloonInfo(`${file.name}: ${nieuwePosities.length} posities, ${nieuweWerknemers.length} werknemers, ${nieuweIndelingen.length} indelingen overgenomen.`);
        setAppMelding({type:'success', bericht:`Sjabloon geladen uit ${file.name}.`});
      } catch(err){
        setAppMelding({type:'error', bericht:'Kon dit bestand niet als sjabloon gebruiken: ' + (err.message || 'ongeldig bestand')});
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const handleJSON = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    importJSONFile(file);
    e.target.value = '';
  };

  const handleJSONDrop = (e) => {
    e.preventDefault();
    setSleepActief(false);
    const item = [...e.dataTransfer.items].find(it => it.kind === 'file');
    if(!item){
      const file = e.dataTransfer.files[0];
      if(file) importJSONFile(file);
      return;
    }
    if(item.getAsFile && !/\.json$/i.test(item.getAsFile()?.name || '')){
      alert('Alleen .json-bestanden kunnen hier ingeladen worden.');
      return;
    }
    importJSONVanDrop(item);
  };
  const handlePosCSV = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    leesCSVBestand(file, (tekst) => {
      importPosities(parseCSV(tekst));
      setPosBestanden(prev => [...prev, file.name]);
    });
    e.target.value = '';
  };
  const handleWnCSV = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    leesCSVBestand(file, (tekst) => {
      importWerknemers(parseCSV(tekst));
      setWnBestanden(prev => [...prev, file.name]);
    });
    e.target.value = '';
  };

  const nieuwEvenement = () => {
    if(confirm('Alle huidige gegevens (posities, werknemers, indelingen) wissen en met een leeg evenement beginnen?')){
      setState(structuredClone(emptyState));
      setPosBestanden([]); setWnBestanden([]);
    }
  };

  const labelStijl = {fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'.12em', color:'var(--signal)', marginBottom:6};
  const uitlegStijl = {fontSize:13.5, color:'var(--muted)', marginTop:0, marginBottom:0};
  const dividerStijl = {borderTop:'1px solid var(--line)', marginTop:18, paddingTop:18};

  return (
    <div style={{minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', padding:'48px 20px 60px', background:'var(--paper)'}}>
      <img src={LOGO_BASE64} style={{width:150, marginBottom:10}} alt="Scorpions Security" />
      <h1 style={{fontFamily:'var(--display)', fontSize:30, margin:'4px 0 4px', color:'var(--moss-dark)'}}>Plotbord</h1>
      <p className="desktop-only" style={{color:'var(--muted)', marginTop:0, marginBottom:32, textAlign:'center', maxWidth:520}}>
        Maak een nieuw evenement aan, of laad een eerder opgeslagen evenement in.
      </p>
      <p className="phone-only" style={{color:'var(--muted)', marginTop:0, marginBottom:32, textAlign:'center', maxWidth:340}}>
        Kies hieronder een .json-bestand om mee te lezen.
      </p>

      {appMelding && (
        <div style={{
          width:'100%', maxWidth:920, marginBottom:20, borderRadius:4,
          background: appMelding.type==='error' ? 'var(--pill-warn-bg)' : 'var(--success-bg)',
          color: appMelding.type==='error' ? 'var(--warn)' : 'var(--success-fg)',
          padding:'10px 16px', display:'flex', alignItems:'center', justifyContent:'center', gap:14, flexWrap:'wrap', fontSize:13.5,
        }}>
          <span>{appMelding.type==='error' ? 'Let op — ' : ''}{appMelding.bericht}</span>
          {appMelding.type==='error' && (
            <Button variant="ghost" onClick={()=>setAppMelding(null)} style={{padding:'6px 14px', fontSize:13}}>Sluiten</Button>
          )}
        </div>
      )}

      <div className="two-col-layout desktop-only" style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, width:'100%', maxWidth:920, alignItems:'stretch'}}>
        <Card style={{display:'flex', flexDirection:'column'}}>
          <div style={labelStijl}>Nieuw evenement</div>
          <h3 style={{marginTop:0, marginBottom:16, fontFamily:'var(--display)'}}>Aanmaken</h3>

          <Field label="Evenement / wedstrijd">
            <input style={inputStyle} value={state.event.name} onChange={e=>setState(s=>({...s, event:{...s.event, name:e.target.value}}))} />
          </Field>
          <Field label="Datum">
            <input style={inputStyle} type="date" value={state.event.date} onChange={e=>setState(s=>({...s, event:{...s.event, date:e.target.value}}))} />
          </Field>

          <div style={dividerStijl}>
            <div style={labelStijl}>Posities importeren (CSV)</div>
            <p style={uitlegStijl}>
              Kolommen: <strong>naam, sectie, uniform</strong>. Optioneel: <strong>ingang, starttijd, eindtijd, portofoon, plakdienst, leidinggevende, materiaal</strong>.
            </p>
            <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap', marginTop:10}}>
              <input type="file" accept=".csv" onChange={handlePosCSV} />
              <Button variant="ghost" onClick={()=>downloadCSV('posities_sjabloon.csv', POSITIE_CSV_TEMPLATE)} style={{padding:'6px 12px', fontSize:12.5}}>Sjabloon</Button>
            </div>
            <div style={{marginTop:10, fontSize:13.5}}>
              <strong>{state.posities.length}</strong> posities geladen
              {posBestanden.length>0 && <div style={{fontSize:12, color:'var(--muted-light)'}}>{posBestanden.join(', ')}</div>}
            </div>
          </div>

          <div style={dividerStijl}>
            <div style={labelStijl}>Werknemers importeren (CSV)</div>
            <p style={uitlegStijl}>Kolommen: <strong>naam, beveiligingspas, organisatie</strong>.</p>
            <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap', marginTop:10}}>
              <input type="file" accept=".csv" onChange={handleWnCSV} />
              <Button variant="ghost" onClick={()=>downloadCSV('werknemers_sjabloon.csv', WERKNEMER_CSV_TEMPLATE)} style={{padding:'6px 12px', fontSize:12.5}}>Sjabloon</Button>
            </div>
            <div style={{marginTop:10, fontSize:13.5}}>
              <strong>{state.werknemers.length}</strong> werknemers geladen
              {wnBestanden.length>0 && <div style={{fontSize:12, color:'var(--muted-light)'}}>{wnBestanden.join(', ')}</div>}
            </div>
          </div>

          <div style={dividerStijl}>
            <div style={labelStijl}>Dupliceer indeling van vorig evenement</div>
            <p style={uitlegStijl}>
              Neem posities, werknemers en indeling over uit een eerder geëxporteerde .json (bv. van
              een terugkerende wedstrijd/locatie). Iedereen begint hier weer als 'gepland' — check-ins
              worden niet overgenomen.
            </p>
            <div style={{marginTop:10}}>
              <Button variant="ghost" onClick={()=>sjabloonFileRef.current.click()}>Bestand kiezen (.json)</Button>
              <input ref={sjabloonFileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleSjabloonJSON} />
            </div>
            {sjabloonInfo && <div style={{marginTop:10, fontSize:12.5, color:'var(--muted)'}}>{sjabloonInfo}</div>}
          </div>
        </Card>

        <Card style={{display:'flex', flexDirection:'column'}}>
          <div style={labelStijl}>Bestaand evenement</div>
          <h3 style={{marginTop:0, marginBottom:16, fontFamily:'var(--display)'}}>Inladen</h3>
          <p style={uitlegStijl}>
            Laad een eerder opgeslagen .json-bestand (export of autosave) om verder te gaan waar je gebleven was.
            Dit vervangt alle huidige gegevens hiernaast.
            {ondersteuntBestandsToegang && ' Wijzigingen worden daarna automatisch teruggeschreven naar ditzelfde bestand.'}
          </p>
          {importedFileHandle && (
            <p style={{fontSize:12.5, color:'var(--moss-dark)', background:'var(--paper)', borderRadius:4, padding:'8px 12px', marginTop:0}}>
              Gekoppeld aan <strong>{importedFileHandle.name}</strong>.
            </p>
          )}
          <div style={{marginTop:16}}>
            {ondersteuntBestandsToegang ? (
              <Button variant="ghost" onClick={importJSONMetHandle}>Bestand kiezen (.json)</Button>
            ) : (
              <>
                <Button variant="ghost" onClick={()=>jsonFileRef.current.click()}>Bestand kiezen (.json)</Button>
                <input ref={jsonFileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleJSON} />
              </>
            )}
          </div>

          <div
            onDragOver={e=>{ e.preventDefault(); setSleepActief(true); }}
            onDragLeave={()=>setSleepActief(false)}
            onDrop={handleJSONDrop}
            style={{
              marginTop:14, padding:'18px 12px', textAlign:'center', borderRadius:4,
              border:`2px dashed ${sleepActief ? 'var(--signal)' : 'var(--line)'}`,
              background: sleepActief ? 'var(--signal-soft)' : 'var(--paper)',
              fontSize:13, color: sleepActief ? 'var(--signal)' : 'var(--muted-light)',
            }}
          >
            of sleep hier een .json-bestand naartoe
          </div>
        </Card>
      </div>

      <Card style={{width:'100%', maxWidth:920, marginTop:20}}>
        <div style={labelStijl}>Meekijken zonder aan te passen</div>
        <h3 style={{marginTop:0, marginBottom:10, fontFamily:'var(--display)'}}>Kijkmodus (alleen-lezen)</h3>
        <p style={uitlegStijl}>
          Open hetzelfde .json-bestand in kijkmodus terwijl iemand anders er actief in werkt: je ziet
          de actuele stand, maar kunt zelf niets aanpassen.
          {ondersteuntBestandsToegang
            ? ' Het scherm ververst zichzelf automatisch (elke 8 seconden) vanaf het bestand op schijf.'
            : ' Deze browser kan het bestand niet automatisch herladen — gebruik de ververs-knop in kijkmodus om de laatste stand op te halen.'}
        </p>
        <div style={{marginTop:10}}>
          {ondersteuntBestandsToegang ? (
            <Button variant="ghost" onClick={startAlleenLezenMetHandle}>Bestand kiezen om mee te kijken (.json)</Button>
          ) : (
            <>
              <Button variant="ghost" onClick={()=>alleenLezenFileRef.current.click()}>Bestand kiezen om mee te kijken (.json)</Button>
              <input ref={alleenLezenFileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleAlleenLezenBestand} />
            </>
          )}
        </div>
      </Card>

      <div className="desktop-only" style={{width:'100%', maxWidth:920}}>
        <Card style={{marginTop:20, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:16}}>
          <div style={{display:'flex', gap:14, alignItems:'center', flexWrap:'wrap', fontSize:14}}>
            <strong>{state.event.name}</strong>
            <span style={{color:'var(--muted-light)'}}>{state.event.date}</span>
            <Pill tone="ok">{state.posities.length} posities</Pill>
            <Pill tone="ok">{state.werknemers.length} werknemers</Pill>
          </div>
          <div style={{display:'flex', gap:10}}>
            <Button variant="danger" onClick={nieuwEvenement}>Alles wissen</Button>
            <Button variant="signal" onClick={onStart}>Begin met aanmelden →</Button>
          </div>
        </Card>
      </div>
    </div>
  );
}

// ---------- Balie tab ----------
function BalieTab({state, positieById, werknemerById, checkinByIndelingId, checkIn, checkOut, markNoShow, resetCheckin, addIndeling, addWerknemer, checkBeveiligingspasWaarschuwing, setPrintData, printerActief, setPrinterActief, setMateriaalItemIngeleverd}){
  const [query, setQuery] = useState('');
  const [materiaalModal, setMateriaalModal] = useState(null); // {mode:'in'|'uit', indeling, positie, werknemer}
  const [subTab, setSubTab] = useState('balie'); // 'balie' | 'materiaal'
  const [statusFilter, setStatusFilter] = useState('alle'); // 'alle' | 'gepland' | 'ingecheckt' | 'uitgecheckt' | 'no-show'
  const [adHocOpen, setAdHocOpen] = useState(false);
  const [adHocPrefillNaam, setAdHocPrefillNaam] = useState('');
  const [adHocPending, setAdHocPending] = useState(null); // {positieId, werknemerId} — wacht tot dit in state.indelingen landt
  const [adHocNieuweWerknemer, setAdHocNieuweWerknemer] = useState(null); // {naam, positieId} — wacht tot deze in state.werknemers landt

  // Werknemers die matchen met de zoekterm maar nog nergens aan gekoppeld zijn — gebruikt voor
  // de hint bij een lege zoekresultatenlijst ("wel gevonden in de werknemerslijst").
  const nietGekoppeldeZoekMatches = useMemo(() => {
    if(!query.trim()) return [];
    const q = normaliseerNaam(query);
    const gekoppeldeIds = new Set(state.indelingen.map(ind => ind.werknemerId));
    return state.werknemers.filter(w => !gekoppeldeIds.has(w.id) && normaliseerNaam(w.naam).includes(q));
  }, [query, state.werknemers, state.indelingen]);

  const werknemerNamen = useMemo(() => state.werknemers.map(w => w.naam), [state.werknemers]);

  // Elke 30s opnieuw berekenen wie er inmiddels 'te laat' is, ook als er verder niets
  // in de state verandert (anders zou dit alleen updaten bij de eerstvolgende actie).
  const [teLaatTick, setTeLaatTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTeLaatTick(t => t + 1), 30000);
    return () => clearInterval(id);
  }, []);

  // Eén werknemer die op meerdere posities tegelijk staat (bv. regulier + plakdienst) hoeft
  // maar één keer bij de balie te verschijnen — dus één rij per werknemer, met daaronder al
  // zijn/haar posities. In-/uitchecken, no-show en terugzetten cascaderen al naar alle
  // indelingen van diezelfde werknemer (zie checkIn/checkOut/markNoShow/resetCheckin), dus de
  // status van de items binnen een rij hoort altijd gelijk te lopen.
  const alleRows = useMemo(() => {
    const perWerknemer = new Map();
    state.indelingen.forEach(ind => {
      const werknemer = werknemerById[ind.werknemerId];
      if(!werknemer) return;
      const positie = positieById[ind.positieId];
      const checkin = checkinByIndelingId[ind.id];
      if(!perWerknemer.has(werknemer.id)) perWerknemer.set(werknemer.id, {werknemer, items: []});
      perWerknemer.get(werknemer.id).items.push({indeling: ind, positie, checkin});
    });
    return [...perWerknemer.values()].map(({werknemer, items}) => {
      const statussen = items.map(it => it.checkin?.status || 'gepland');
      let status = 'gepland';
      if(statussen.every(s => s === 'uitgecheckt')) status = 'uitgecheckt';
      else if(statussen.some(s => s === 'ingecheckt')) status = 'ingecheckt';
      else if(statussen.every(s => s === 'no-show')) status = 'no-show';
      const teLaat = status === 'gepland' && items.some(it => isTeLaat(it.positie?.startTijd));
      return {werknemerId: werknemer.id, werknemer, items, status, teLaat};
    }).sort((a,b) => (b.teLaat - a.teLaat) || a.werknemer.naam.localeCompare(b.werknemer.naam));
    // eslint-disable-next-line
  }, [state, positieById, werknemerById, checkinByIndelingId, teLaatTick]);

  const rows = useMemo(() => {
    const q = query.toLowerCase();
    return alleRows
      .filter(r => !q || r.werknemer.naam.toLowerCase().includes(q) || (r.werknemer.organisatie||'').toLowerCase().includes(q))
      .filter(r => statusFilter === 'alle' || r.status === statusFilter);
  }, [alleRows, query, statusFilter]);

  // Openstaand materiaal: alle losse materiaal-items (over alle werknemers, ongeacht of ze al
  // zijn uitgecheckt) die nog niet als ingeleverd zijn afgevinkt.
  const openstaandMateriaal = useMemo(() => {
    const rows = [];
    state.indelingen.forEach(ind => {
      const positie = positieById[ind.positieId];
      const werknemer = werknemerById[ind.werknemerId];
      const checkin = checkinByIndelingId[ind.id];
      if(!werknemer || !checkin?.materiaalUitgegeven?.length) return;
      const openItems = checkin.materiaalUitgegeven
        .map((m, idx) => ({...m, idx}))
        .filter(m => !m.ingeleverd);
      if(openItems.length === 0) return;
      rows.push({indeling: ind, positie, werknemer, checkin, openItems});
    });
    return rows.sort((a,b) => a.werknemer.naam.localeCompare(b.werknemer.naam));
  }, [state, positieById, werknemerById, checkinByIndelingId]);

  const totaalOpenItems = useMemo(() => openstaandMateriaal.reduce((sum, r) => sum + r.openItems.length, 0), [openstaandMateriaal]);

  // Tellingen voor het overzicht rechtsboven in de balk. Gebaseerd op alleRows (dus alleen
  // indelingen die nog echt bestaan) i.p.v. rechtstreeks op state.checkins — anders tellen
  // checkins van inmiddels verwijderde posities/werknemers per ongeluk nog mee.
  const ingecheckt = useMemo(() => alleRows.filter(r=>r.status==='ingecheckt').length, [alleRows]);
  const uitgecheckt = useMemo(() => alleRows.filter(r=>r.status==='uitgecheckt').length, [alleRows]);
  const noShow = useMemo(() => alleRows.filter(r=>r.status==='no-show').length, [alleRows]);
  const nogTeGaan = Math.max(alleRows.length - ingecheckt - uitgecheckt - noShow, 0);

  const statusTone = (status) => {
    if(status==='ingecheckt') return 'ok';
    if(status==='uitgecheckt') return 'default';
    if(status==='no-show') return 'warn';
    return 'signal';
  };
  const statusLabel = (status) => ({
    'gepland':'Gepland', 'ingecheckt':'Ingecheckt', 'uitgecheckt':'Uitgecheckt', 'no-show':'No-show'
  }[status] || 'Gepland');

  // row is nu per werknemer (mogelijk meerdere posities/items). Het materiaalscherm werkt met
  // één positie tegelijk, dus de eerste (primaire) indeling stuurt het scherm — inchecken
  // daarvan cascadeert automatisch (met eigen standaardmateriaal) naar de overige posities van
  // dezelfde werknemer, zie checkIn/checkOut.
  const openInchecken = (row) => {
    const item = row.items[0];
    // Standaard de geplande starttijd van de positie, want die staat vast — behalve als die
    // starttijd al voorbij is: dan is de werknemer sowieso later dan gepland, en heeft de actuele
    // tijd (afgerond op een kwartier, met een korte drempel van 5 minuten) meer waarde als
    // voorstel. Is er geen geplande starttijd, dan valt dit terug op het huidige tijdstip.
    const standaardInTijd = item.checkin?.inTijd || (
      item.positie.startTijd
        ? (isStartTijdVerstreken(item.positie.startTijd) ? rondAfOpKwartier(nowTime(), 5) : item.positie.startTijd)
        : nowTime()
    );
    setMateriaalModal({
      mode:'in',
      indeling: item.indeling, positie: item.positie, werknemer: row.werknemer,
      startMateriaal: item.checkin?.materiaalUitgegeven?.length ? item.checkin.materiaalUitgegeven : item.positie.materiaal,
      startInTijd: standaardInTijd,
    });
  };
  const openUitchecken = (row) => {
    const item = row.items[0];
    setMateriaalModal({
      mode:'uit',
      indeling: item.indeling, positie: item.positie, werknemer: row.werknemer,
      startMateriaal: item.checkin?.materiaalUitgegeven || [],
      startOpmerking: item.checkin?.opmerking || '',
      // Uitchecktijd is altijd het huidige tijdstip, afgerond op een kwartier met een drempel van
      // 10 minuten (<10 min naar beneden, erboven naar boven) — de geplande eindtijd van de
      // positie wordt hier bewust niet als vaste standaard gebruikt. Blijft aanpasbaar in het scherm.
      startUitTijd: item.checkin?.uitTijd || rondAfOpKwartier(nowTime()),
    });
  };

  // Koppelt een bestaande werknemer aan een positie en opent daarna, zodra die koppeling
  // in de state staat, meteen het inchecken-scherm.
  const koppelEnInchecken = (positieId, werknemerId, forceerExtra) => {
    const positie = positieById[positieId];
    const werknemer = werknemerById[werknemerId];
    const waarschuwing = checkBeveiligingspasWaarschuwing(positie, werknemer);
    if(waarschuwing && !window.confirm(waarschuwing + '\n\nToch doorgaan?')) return null;
    const error = addIndeling(positieId, werknemerId, forceerExtra);
    if(error) return error;
    setAdHocOpen(false);
    setAdHocPending({positieId, werknemerId});
    return null;
  };

  // Werknemer toevoegen bij de balie: als de getypte naam al bestaat wordt die gekoppeld,
